<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI健康预测 · 小康·健康管家</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div id="app-nav"></div>

  <main class="main pred-page">
    <header class="page-head pred-page-head">
      <a href="monitoring.html" class="btn btn-ghost" style="margin-bottom:8px;padding:6px 0">← 返回监测</a>
      <h1>AI 健康预测</h1>
      <p class="subtitle">看清真实记录、个人基线和短期变化 · 预测不可靠时主动停止</p>
    </header>

    <!-- 时间范围切换 -->
    <div class="pred-range-bar" id="range-bar">
      <button class="chip" data-days="7" data-future="7">短期（7天 + 预测7天）</button>
      <button class="chip" data-days="30" data-future="14">阶段（30天 + 最多预测14天）</button>
      <button class="chip active" data-days="90" data-future="30">长期（90天 + 数据足够时预测30天）</button>
    </div>
    <details class="pred-chart-toolbar pred-display-settings" aria-label="曲线显示控制">
      <summary>曲线显示设置</summary>
      <div class="pred-display-settings-body">
        <div class="pred-chart-toggles" role="group" aria-label="曲线图层">
          <button class="pred-toggle" data-layer="raw" type="button">● 原始记录</button>
          <button class="pred-toggle active" data-layer="fitted" type="button">┄ 变化趋势</button>
          <button class="pred-toggle" data-layer="peer" type="button">— 同龄参考</button>
          <button class="pred-toggle active" data-layer="forecast" type="button">▱ 未来范围</button>
        </div>
        <label class="pred-zoom-control" for="chart-days">
          <span>显示最近 <strong id="chart-days-label">90</strong> 天</span>
          <input id="chart-days" type="range" min="7" max="90" step="1" value="90" />
        </label>
      </div>
    </details>

    <div class="pred-focus-intro">
      <div class="pred-focus-intro-title">先选一项查看</div>
      <div class="pred-focus-intro-text">每次只看一个指标，更容易发现变化。</div>
      <div class="pred-metric-selector" id="metric-selector"></div>
    </div>
    <div class="pred-elder-summary" id="metric-summary"></div>

    <!-- 各指标预测图 -->
    <div id="metric-charts"></div>

    <!-- 综合健康分仅作为可选历史回顾 -->
    <details class="pred-composite-card pred-composite-details">
      <summary>查看综合健康历史趋势</summary>
      <div class="pred-composite-sub" id="composite-sub">用于回顾各项指标的综合变化，不外推未来健康分</div>
      <div class="pred-composite-svg-wrap">
        <svg id="composite-chart" width="100%" height="280" viewBox="0 0 1060 280" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div class="pred-legend" id="composite-legend"></div>
    </details>

    <div style="text-align:center;padding:20px 0 40px;color:#9C8B7A;font-size:13px;font-family:var(--font-cn)">
      <p>历史曲线采用稳健平滑，未来虚线为通过时间顺序验证后的保守外推，仅供健康管理参考</p>
      <p>同龄人平均数据来自年龄段统计参考值</p>
    </div>
  </main>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    Auth.init().then(() => main());

    let days = 90;
    let futureDays = 30;
    let metricList = [];
    let metricResults = [];
    let selectedMetricType = null;
    const populationPredictionCache = new Map();
    // 默认突出个人趋势与短期范围；原始明细和同龄人参考按需打开，避免第一屏图层过载。
    const chartVisibility = { raw: false, fitted: true, peer: false, forecast: true };
    let zoomTimer = null;

    async function main() {
      bindRange();
      bindChartControls();
      await loadAll();
    }

    function bindRange() {
      const bar = document.getElementById('range-bar');
      bar.addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        bar.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
        days = parseInt(b.dataset.days, 10);
        futureDays = parseInt(b.dataset.future, 10);
        const slider = document.getElementById('chart-days');
        const label = document.getElementById('chart-days-label');
        if (slider) slider.value = days;
        if (label) label.textContent = days;
        loadAll();
      });
    }

    function bindChartControls() {
      document.querySelectorAll('.pred-toggle').forEach(button => {
        button.addEventListener('click', () => {
          const layer = button.dataset.layer;
          chartVisibility[layer] = !chartVisibility[layer];
          button.classList.toggle('active', chartVisibility[layer]);
          loadAll();
        });
      });
      const slider = document.getElementById('chart-days');
      const label = document.getElementById('chart-days-label');
      if (!slider) return;
      slider.addEventListener('input', () => {
        days = parseInt(slider.value, 10);
        futureDays = days <= 7 ? 7 : days <= 30 ? 14 : 30;
        if (label) label.textContent = days;
        document.querySelectorAll('#range-bar button').forEach(b => b.classList.toggle('active', parseInt(b.dataset.days, 10) === days));
        clearTimeout(zoomTimer);
        zoomTimer = setTimeout(loadAll, 260);
      });
    }

    async function loadAll() {
      try {
        // 并行加载：指标列表 + 综合预测
        const [list, composite] = await Promise.all([
          API.get('/api/prediction/overview/list?days=' + days),
          API.get(`/api/prediction/overview/composite?days=${days}&future=${futureDays}`),
        ]);
        metricList = list;
        renderComposite(composite);
        await renderMetricCharts();
      } catch (err) {
        document.getElementById('composite-sub').textContent = '加载失败：' + err.message;
      }
    }

    // 用单调三次 Hermite Path 绘制趋势线：比 polyline 连线平滑，同时避免普通样条过冲。
    function monotonePath(points) {
      if (!points || points.length === 0) return '';
      if (points.length === 1) return `M ${points[0].x} ${points[0].y}`;
      const n = points.length;
      const slopes = [];
      for (let i = 0; i < n - 1; i++) {
        const dx = points[i + 1].x - points[i].x || 1;
        slopes.push((points[i + 1].y - points[i].y) / dx);
      }
      const tangents = Array(n).fill(0);
      tangents[0] = slopes[0];
      tangents[n - 1] = slopes[n - 2];
      for (let i = 1; i < n - 1; i++) {
        if (slopes[i - 1] * slopes[i] <= 0) tangents[i] = 0;
        else {
          const h0 = points[i].x - points[i - 1].x || 1;
          const h1 = points[i + 1].x - points[i].x || 1;
          const w0 = 2 * h1 + h0;
          const w1 = h1 + 2 * h0;
          tangents[i] = (w0 + w1) / (w0 / slopes[i - 1] + w1 / slopes[i]);
        }
      }
      for (let i = 0; i < n - 1; i++) {
        if (slopes[i] === 0) { tangents[i] = 0; tangents[i + 1] = 0; continue; }
        const a = tangents[i] / slopes[i];
        const b = tangents[i + 1] / slopes[i];
        const norm = a * a + b * b;
        if (norm > 9) {
          const tau = 3 / Math.sqrt(norm);
          tangents[i] = tau * a * slopes[i];
          tangents[i + 1] = tau * b * slopes[i];
        }
      }
      let d = `M ${points[0].x} ${points[0].y}`;
      for (let i = 0; i < n - 1; i++) {
        const p0 = points[i], p1 = points[i + 1];
        const dx = (p1.x - p0.x) / 3;
        d += ` C ${p0.x + dx} ${p0.y + tangents[i] * dx}, ${p1.x - dx} ${p1.y - tangents[i + 1] * dx}, ${p1.x} ${p1.y}`;
      }
      return d;
    }

    // 统一时间轴：历史点和未来点按真实时间间隔定位，并在轴上显示可读日期。
    function pointTime(point, fallbackIndex = 0) {
      const parsed = Date.parse(point?.recorded_at || point?.date || '');
      return Number.isFinite(parsed) ? parsed : fallbackIndex * 86400000;
    }

    function formatAxisDate(timestamp) {
      const d = new Date(timestamp);
      if (!Number.isFinite(d.getTime())) return '';
      return `${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
    }

    function formatPointTime(point) {
      const t = pointTime(point);
      const d = new Date(t);
      return Number.isFinite(d.getTime()) ? d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }) : '';
    }

    function buildTimeAxis(timeline, xToPx, top, bottom, actualLength, predictedLength) {
      if (!timeline.length) return '';
      const indices = new Set([0, timeline.length - 1]);
      if (actualLength > 1) indices.add(actualLength - 1);
      // 最多 5 个标签，避免记录较密时日期互相覆盖。
      const slots = Math.min(5, timeline.length);
      for (let i = 1; i < slots - 1; i += 1) indices.add(Math.round(i * (timeline.length - 1) / (slots - 1)));
      return [...indices].sort((a, b) => a - b).map(i => {
        const x = xToPx(i);
        const isBoundary = predictedLength > 0 && i === actualLength - 1;
        return `<line x1="${x}" y1="${top}" x2="${x}" y2="${bottom}" stroke="${isBoundary ? '#B8D7F5' : '#F3EEE8'}" stroke-width="${isBoundary ? 1.2 : 1}" stroke-dasharray="${isBoundary ? '4,4' : '2,5'}"/>` +
          `<text x="${x}" y="${bottom + 20}" text-anchor="middle" fill="${isBoundary ? '#2563EB' : '#7E7063'}" font-size="13" font-family="sans-serif">${formatAxisDate(timeline[i])}</text>`;
      }).join('');
    }

    function legendItem(label, color, dashed = false) {
      return `<div class="pred-legend-item" style="color:${color}"><div class="${dashed ? 'pred-legend-dash' : 'pred-legend-line'}" style="${dashed ? `border-color:${color}` : `background:${color}`}" ></div>${label}</div>`;
    }

    function legendBandItem(label, color) {
      return `<div class="pred-legend-item" style="color:${color}"><div class="pred-legend-band" style="background:${color}"></div>${label}</div>`;
    }

    function selectedModelScore(analysis) {
      const backtest = analysis?.backtest;
      const selected = backtest?.selected || analysis?.forecastModel || analysis?.model;
      return analysis?.modelScore || backtest?.scores?.[selected] || null;
    }

    function forecastQuality(analysis) {
      if (!analysis?.forecastAvailable) return { level: 'off', label: '暂不外推', detail: analysis?.forecastReason || '数据不足' };
      const score = selectedModelScore(analysis);
      const mase = Number(score?.mase);
      if (!Number.isFinite(mase)) return { level: 'reference', label: '参考估计', detail: '回测信息不完整' };
      if (mase < 0.8) return { level: 'good', label: '趋势预测', detail: `MASE ${mase.toFixed(2)}` };
      if (mase < 1) return { level: 'reference', label: '参考估计', detail: `接近简单基线 · MASE ${mase.toFixed(2)}` };
      return { level: 'baseline', label: '仅基线参考', detail: `未优于简单基线 · MASE ${mase.toFixed(2)}` };
    }

    function percentile(values, q) {
      const sorted = values.filter(Number.isFinite).sort((a, b) => a - b);
      if (!sorted.length) return 0;
      const pos = (sorted.length - 1) * q;
      const lo = Math.floor(pos), hi = Math.ceil(pos);
      return sorted[lo] + (sorted[hi] - sorted[lo]) * (pos - lo);
    }

    function thinObservedPoints(points, maxPoints = 72) {
      if (!Array.isArray(points) || points.length <= maxPoints) return points || [];
      const keep = new Map();
      const stride = Math.ceil(points.length / maxPoints);
      points.forEach((point, index) => {
        if (point.outlier || index === 0 || index === points.length - 1 || index % stride === 0) {
          keep.set(point.id ?? `${point.recorded_at}-${index}`, point);
        }
      });
      return [...keep.values()];
    }

    function predictionModeLabel(mode) {
      return ({ value: '数值预测', range: '范围估计', risk: '风险估计', anomaly: '异常识别', derived: '公式推导', not_supported: '暂不支持' })[mode] || '暂不支持';
    }

    function escapeText(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
    }

    function buildLegend(data, actualLabel = '直接测量值', forecastLabel = '预测值', actualColor = '#F4A261') {
      const items = [];
      if (Array.isArray(data.series) && data.series.length > 1) {
        data.series.forEach((series, index) => {
          const color = series.color || (index ? '#9C7BC9' : actualColor);
          if (series.observed?.length) items.push(legendItem(`${series.label || series.id}（直接测量值）`, color));
          if (series.trend?.length) items.push(legendItem(`${series.label || series.id}趋势`, color, true));
          if (series.forecast?.points?.length) items.push(legendItem(`${series.label || series.id}（预测值）`, color, true));
        });
        if (data.series.some(series => series.forecast?.points?.some(p => Number.isFinite(p.lower) && Number.isFinite(p.upper)))) {
          items.push(legendBandItem('预测范围', '#7A91C7'));
        }
        return items.join('') || '<span class="pred-metric-tag">暂无可绘制曲线</span>';
      }
      if (data.actual?.length) items.push(legendItem(actualLabel, actualColor));
      if (data.fitted?.length) items.push(legendItem('历史拟合', '#A45F3D', true));
      if (data.predicted?.length) {
        items.push(legendItem(forecastLabel, '#2563EB', true));
        if (data.predicted.some(p => Number.isFinite(p.lower) && Number.isFinite(p.upper))) {
          items.push(legendBandItem('预测区间', '#2563EB'));
        }
      }
      if (data.peer?.length) items.push(legendItem('同龄人平均', '#9C8B7A'));
      return items.join('') || '<span class="pred-metric-tag">暂无可绘制曲线</span>';
    }

    function attachSvgTooltip(svg) {
      if (!svg?.parentElement) return;
      const host = svg.parentElement;
      host.querySelector('.pred-chart-tooltip')?.remove();
      const tooltip = document.createElement('div');
      tooltip.className = 'pred-chart-tooltip';
      tooltip.setAttribute('role', 'status');
      host.appendChild(tooltip);
      // 时间和值放在 circle 内部的 <title> 节点，不是 circle 的 title 属性。
      const points = svg.querySelectorAll('circle');
      points.forEach(point => {
        point.addEventListener('mouseenter', () => {
          tooltip.textContent = point.querySelector('title')?.textContent || '';
          tooltip.classList.add('visible');
        });
        point.addEventListener('mousemove', event => {
          const rect = host.getBoundingClientRect();
          tooltip.style.left = `${Math.max(8, Math.min(rect.width - 180, event.clientX - rect.left + 10))}px`;
          tooltip.style.top = `${Math.max(4, event.clientY - rect.top - 42)}px`;
        });
        point.addEventListener('mouseleave', () => tooltip.classList.remove('visible'));
      });
    }

    // ===== 综合健康拟合图 =====
    function renderComposite(data) {
      const svg = document.getElementById('composite-chart');
      const actual = data.actual || [];
      const predicted = chartVisibility.forecast ? (data.predicted || []) : [];
      const peer = data.peer || [];
      const showRaw = chartVisibility.raw;
      const showFitted = chartVisibility.fitted;
      const showPeer = chartVisibility.peer;
      const showForecast = chartVisibility.forecast;

      const sub = document.getElementById('composite-sub');
      const legend = document.getElementById('composite-legend');
      if (legend) legend.innerHTML = buildLegend({
        ...data,
        actual: showRaw ? actual : [],
        fitted: showFitted ? (data.fitted || []) : [],
        predicted: showForecast ? predicted : [],
        peer: showPeer ? peer : [],
      }, '健康分（直接测量值计算）', '健康分（预测值）');
      const metricCount = Number.isFinite(Number(data.metricCount)) ? data.metricCount : 0;
      const ageGroup = data.ageGroup || '未分组';
      const peerBaseScore = data.peerBaseScore ?? '—';
      sub.textContent = `综合 ${metricCount} 项指标归一化拟合 · 年龄段：${ageGroup} · 同龄人均值 ${peerBaseScore} 分` +
        (data.predicted?.length ? (data.analysis?.confidence ? ` · 预测可信度 ${Math.round(data.analysis.confidence * 100)}%` : '') : ` · ${data.analysis?.forecastReason || '历史数据暂不足，请继续打卡记录'}`);

      const allPoints = [
        ...actual.map((p, i) => ({ x: i, y: p.value, predicted: false })),
        ...predicted.map((p, i) => ({ x: actual.length + i, y: p.value, predicted: true })),
      ];

      if (allPoints.length === 0) {
        svg.innerHTML = '<text x="50%" y="50%" text-anchor="middle" fill="#9C8B7A" font-size="16" font-family="sans-serif">暂无数据</text>';
        return;
      }

      const W = 1060, H = 280, padL = 50, padR = 30, padT = 30, padB = 40;
      const totalLen = allPoints.length;
      const peerLen = Math.max(totalLen, peer.length);
      const timeline = [...actual, ...predicted].map((p, i) => pointTime(p, i));
      const tStart = timeline[0] ?? 0;
      const tEnd = timeline[timeline.length - 1] ?? tStart;
      const tSpan = Math.max(tEnd - tStart, 1);

      const allVals = [...allPoints.map(p => p.y), ...peer,
        ...predicted.flatMap(p => [p.lower, p.upper]).filter(Number.isFinite)];
      const yMin = Math.min(...allVals) - 5;
      const yMax = Math.max(...allVals) + 5;
      const yLo = Math.max(0, yMin);
      const yHi = Math.min(100, yMax);

      const xToPx = (i) => padL + (totalLen <= 1 ? (W - padL - padR) / 2 : ((timeline[i] - tStart) / tSpan) * (W - padL - padR));
      const yToPx = (v) => H - padB - ((v - yLo) / (yHi - yLo || 1)) * (H - padT - padB);

      // 分割线位置
      const dividerX = showForecast && predicted.length && actual.length > 0 ? xToPx(actual.length - 1) : null;

      const fittedPath = monotonePath((data.fitted || []).map((p, i) => ({ x: xToPx(i), y: yToPx(p.value) })));
      // 预测线（从最后一个实际点开始）
      const predStart = actual.length > 0 ? actual[actual.length - 1] : null;
      const predPoints = predStart ? [{ x: actual.length - 1, y: predStart.value }, ...predicted.map((p, i) => ({ x: actual.length + i, y: p.value }))] : [];
      const predPath = monotonePath(predPoints.map(p => ({ x: xToPx(p.x), y: yToPx(p.y) })));
      const predBand = predicted.length && predicted.every(p => Number.isFinite(p.lower) && Number.isFinite(p.upper))
        ? `<polygon points="${predicted.map((p, i) => `${xToPx(actual.length + i)},${yToPx(p.upper)}`).join(' ')} ${predicted.slice().reverse().map((p, i) => `${xToPx(actual.length + predicted.length - 1 - i)},${yToPx(p.lower)}`).join(' ')}" fill="#2563EB" opacity="0.16"/>` : '';

      // 同龄人线
      const peerPolyline = peer.slice(0, totalLen).map((v, i) => `${xToPx(i)},${yToPx(v)}`).join(' ');

      // Y轴标签
      const yLabels = [yLo, Math.round((yLo + yHi) / 2), yHi].map(v => {
        const y = yToPx(v);
        return `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#F0EDE8" stroke-width="1" stroke-dasharray="4,4"/><text x="${padL - 8}" y="${y + 4}" text-anchor="end" fill="#9C8B7A" font-size="12" font-family="sans-serif">${Math.round(v)}</text>`;
      }).join('');

      // 分割线
      const dividerLine = dividerX != null ? `
        <line x1="${dividerX}" y1="${padT}" x2="${dividerX}" y2="${H - padB}" stroke="#E8DCC9" stroke-width="1.5" stroke-dasharray="6,4"/>
        <text x="${dividerX + 6}" y="${padT + 14}" class="pred-divider-label" font-family="sans-serif" fill="#9C8B7A" font-size="11">预测起点 →</text>
      ` : '';
      const forecastShade = dividerX != null
        ? `<rect x="${dividerX}" y="${padT}" width="${W - padR - dividerX}" height="${H - padT - padB}" fill="#2563EB" opacity="0.035"/>`
        : '';
      const timeAxis = buildTimeAxis(timeline, xToPx, padT, H - padB, actual.length, showForecast ? predicted.length : 0);

      // 数据点
      const dots = actual.map((p, i) =>
        `<circle cx="${xToPx(i)}" cy="${yToPx(p.value)}" r="3.5" fill="#F4A261" stroke="#fff" stroke-width="1.5"><title>${formatPointTime(p)} · ${p.value}</title></circle>`
      ).join('');
      const forecastDots = predicted.map((p, i) =>
        `<circle cx="${xToPx(actual.length + i)}" cy="${yToPx(p.value)}" r="2.5" fill="#2563EB" stroke="#fff" stroke-width="1"><title>${formatPointTime(p)} · 预测 ${p.value}</title></circle>`
      ).join('');

      svg.innerHTML = `
        ${yLabels}
        <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="#E8DCC9" stroke-width="1"/>
        <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}" stroke="#E8DCC9" stroke-width="1"/>
        ${timeAxis}
        ${showForecast ? forecastShade : ''}
        <!-- 同龄人线 -->
        ${showPeer ? `<polyline points="${peerPolyline}" fill="none" stroke="#9C8B7A" stroke-width="2" stroke-linecap="round" opacity="0.5"/>` : ''}
        <!-- 原始测量值只用散点显示，避免把异常点连成不真实的尖峰折线 -->
        <!-- 历史拟合线 -->
        ${showFitted ? `<path d="${fittedPath}" fill="none" stroke="#A45F3D" stroke-width="1.8" stroke-dasharray="2,3" opacity="0.85"/>` : ''}
        <!-- 预测线 -->
        ${showForecast ? predBand : ''}
        ${showForecast ? `<path d="${predPath}" fill="none" stroke="#2563EB" stroke-width="3" stroke-dasharray="7,4" stroke-linecap="round" opacity="0.95"/>` : ''}
        ${showForecast ? dividerLine : ''}
        ${showRaw ? dots : ''}
        ${showForecast ? forecastDots : ''}
      `;
      attachSvgTooltip(svg);
    }

    // ===== 各指标预测图 =====
    function readableValue(value) {
      const n = Number(value);
      if (!Number.isFinite(n)) return '—';
      return Math.abs(n) >= 100 ? String(Math.round(n)) : String(Number(n.toFixed(1)));
    }

    function metricAction(type) {
      const actions = {
        bp: '早晚固定时间测量，测前静坐5分钟。',
        glucose: '按相同的空腹或餐后条件继续记录。',
        weight: '晨起后按相同条件称重，每周比较一次。',
        hr: '静坐5分钟后测量，记录静息心率。',
        sleep: '记录入睡和起床时间，先看一周规律。',
        steps: '按体力分段活动，不追求单日精确步数。',
        spo2: '静坐后复测，连续偏低或不适时联系医生。',
      };
      return actions[type] || '保持相同条件继续记录。';
    }

    function renderMetricSummary(data, m) {
      const host = document.getElementById('metric-summary');
      if (!host) return;
      const series = Array.isArray(data?.series) && data.series.length ? data.series : [];
      const latest = series.map(item => ({ item, point: (item.observed || []).slice().sort((a, b) => pointTime(a) - pointTime(b)).at(-1) })).filter(x => x.point);
      if (!latest.length) {
        host.innerHTML = '<div class="pred-elder-summary-empty">还没有记录。先完成一次测量，我再帮您看变化。</div>';
        return;
      }
      const current = m.type === 'bp' && latest.length >= 2
        ? `${readableValue(latest[0].point.value)}/${readableValue(latest[1].point.value)} ${m.unit || ''}`
        : `${m.type === 'glucose' && latest[0].item.label ? `${latest[0].item.label} ` : ''}${readableValue(latest[0].point.value)} ${m.unit || latest[0].item.unit || ''}`;
      const base = latest[0].item.baseline || data.baseline;
      const difference = base?.value == null ? null : Number(latest[0].point.value) - Number(base.value);
      const tolerance = Math.max(Math.abs(Number(base?.value || 0)) * 0.03, m.type === 'glucose' ? 0.2 : 1);
      const baselineText = difference == null ? '个人基线还在积累' : Math.abs(difference) <= tolerance ? '和个人平时水平接近' : difference > 0 ? '比个人平时水平偏高' : '比个人平时水平偏低';
      const trendText = data.predTrend === 'up' ? '最近整体向上' : data.predTrend === 'down' ? '最近整体向下' : '最近整体平稳';
      const grade = forecastQuality(data.analysis);
      const forecastText = grade.level === 'off' ? '暂不判断未来' : grade.level === 'baseline' ? '未来只作范围参考' : grade.level === 'reference' ? '未来变化仅供参考' : '可查看短期变化范围';
      host.innerHTML = `
        <div class="pred-elder-summary-card"><span>现在</span><strong>${current.trim()}</strong><small>${formatPointTime(latest[0].point)}</small></div>
        <div class="pred-elder-summary-card"><span>变化</span><strong>${baselineText}</strong><small>${trendText} · ${forecastText}</small></div>
        <div class="pred-elder-summary-card pred-elder-summary-action"><span>下一步</span><strong>${metricAction(m.type)}</strong><small>连续记录比单次波动更重要</small></div>`;
    }

    function renderMetricSelector() {
      const selector = document.getElementById('metric-selector');
      if (!selector) return;
      selector.innerHTML = metricList.map(m => `<button type="button" class="pred-metric-select ${m.type === selectedMetricType ? 'active' : ''}" data-metric="${m.type}">${m.icon || '测'} ${m.name || m.type}</button>`).join('');
      selector.querySelectorAll('button').forEach(button => button.addEventListener('click', () => {
        selectedMetricType = button.dataset.metric;
        renderFocusedMetric();
      }));
    }

    function renderFocusedMetric() {
      const host = document.getElementById('metric-charts');
      const index = metricList.findIndex(m => m.type === selectedMetricType);
      const m = metricList[index];
      const data = metricResults[index];
      renderMetricSelector();
      if (!m || !data) {
        host.innerHTML = '<div class="empty" style="padding:40px;text-align:center">该指标暂时没有可用数据</div>';
        return;
      }
      host.innerHTML = renderMetricCard(data, m);
      renderMetricChart(`metric-svg-${m.type}`, data, m);
      renderMetricSummary(data, m);
      loadPopulationEstimate(m);
    }

    async function loadPopulationEstimate(m) {
      const host = document.getElementById(`population-estimate-${m.type}`);
      if (!host) return;
      try {
        let result = populationPredictionCache.get(m.type);
        if (!result) {
          result = await API.get(`/api/prediction/population/${m.type}`);
          populationPredictionCache.set(m.type, result);
        }
        if (selectedMetricType !== m.type || !document.getElementById(`population-estimate-${m.type}`)) return;
        if (result.status !== 'available') {
          host.innerHTML = `<strong>${escapeText(result.display_label || '估计值')}：</strong>${escapeText(result.reason || '当前资料不足，暂不输出人群模型结果')}`;
          return;
        }
        if (result.prediction_mode === 'risk') {
          const level = ({ low: '低', medium: '中', high: '高' })[result.risk_level] || '待定';
          const probability = Number.isFinite(Number(result.risk_probability)) ? `（模型概率 ${Math.round(Number(result.risk_probability) * 100)}%）` : '';
          host.innerHTML = `<strong>估计值：</strong>长期化验异常风险为<strong>${level}</strong>${probability}。这是筛查风险，不是化验结果。`;
        } else if (result.components?.systolic && result.components?.diastolic) {
          host.innerHTML = `<strong>预测值：</strong>CHARLS人群长期模型约 ${escapeText(result.components.systolic.point)}/${escapeText(result.components.diastolic.point)} mmHg；时间尺度约2年，不等同于图中的7天预测。`;
        } else {
          const interval = result.lower != null && result.upper != null ? `，范围 ${escapeText(result.lower)}～${escapeText(result.upper)}` : '';
          host.innerHTML = `<strong>${escapeText(result.display_label || '预测值')}：</strong>CHARLS人群长期模型约 ${escapeText(result.point)}${m.unit ? ` ${escapeText(m.unit)}` : ''}${interval}；不等同于短期曲线。`;
        }
      } catch {
        host.innerHTML = '<strong>估计值：</strong>人群模型暂不可用，已保留个体历史趋势。';
      }
    }

    async function renderMetricCharts() {
      const host = document.getElementById('metric-charts');
      if (!metricList.length) {
        host.innerHTML = '<div class="empty" style="padding:40px;text-align:center">暂无指标数据，请先在监测页录入</div>';
        return;
      }

      // 并行加载所有指标预测
      const promises = metricList.map(m =>
        API.get(`/api/prediction/${m.type}?days=${days}&future=${futureDays}`).catch(err => null)
      );
      metricResults = await Promise.all(promises);
      if (!selectedMetricType || !metricList.some(m => m.type === selectedMetricType)) {
        selectedMetricType = metricList.some(m => m.type === 'bp') ? 'bp' : metricList[0]?.type;
      }
      renderFocusedMetric();
    }

    function renderMetricCard(data, m) {
      const unitLabel = m.unit || '';
      const nameLabel = m.name || m.type || '健康指标';
      const trendMap = { up: '↑ 上升趋势', down: '↓ 下降趋势', stable: '→ 趋势平稳' };
      const trendClass = data.predTrend;
      const trendText = trendMap[data.predTrend] || '—';
      const peerText = data.peerBase ? `同龄人均值 ${data.peerBase.value}${unitLabel}` : '无同龄人参考';
      const forecastGrade = forecastQuality(data.analysis);
      const predictionMode = data.prediction?.prediction_mode || m.prediction_mode || 'not_supported';
      const outputLabel = data.prediction?.display_label || (data.analysis?.forecastAvailable ? '预测值' : '估计值');
      const granularity = data.analysis?.forecastGranularity || data.series?.[0]?.forecast?.granularity;
      const forecastNote = data.analysis?.forecastAvailable
        ? `${forecastGrade.label}，虚线和色带为${granularity === 'weekly' ? '周级' : '短期'}范围估计`
        : `${data.analysis?.forecastReason || '历史数据不足，暂不外推'}；请继续打卡记录，数据满足条件后自动生成预测`;
      const quality = data.analysis?.forecastAvailable
        ? `<span class="pred-quality-${forecastGrade.level}">● ${forecastGrade.label} · ${data.analysis?.forecastDays || data.predicted?.length || 0} 天</span>`
        : `<span class="pred-quality-off">● 暂不外推</span>`;
      const confidenceText = data.analysis?.confidenceLevel
        ? `数据${data.analysis.confidenceLevel}`
        : '数据质量待积累';
      const dateRange = data.analysis?.dateStart && data.analysis?.dateEnd
        ? `${data.analysis.dateStart} 至 ${data.analysis.dateEnd}` : '日期范围待积累';
      const modelText = data.analysis?.model ? forecastGrade.detail : '模型待积累';
      const backtestText = data.analysis?.backtest?.folds ? `滚动回测 ${data.analysis.backtest.folds} 折` : '';
      const conditionText = nameLabel.includes('血糖') && data.analysis?.measurementConditionCoverage != null
        ? `测量条件 ${Math.round(data.analysis.measurementConditionCoverage * 100)}%` : '';
      const stats = data.stats;
      const statsHtml = stats ? `
        <div class="pred-metric-stat">平均 <strong>${stats.avg}</strong>${unitLabel ? ` ${unitLabel}` : ''}</div>
        <div class="pred-metric-stat">范围 <strong>${stats.min}~${stats.max}</strong></div>
        <div class="pred-metric-stat">记录 <strong>${stats.count}</strong> 条</div>
      ` : '<div class="pred-metric-stat">暂无统计</div>';

      return `
        <div class="pred-metric-card">
          <div class="pred-metric-head">
            <div class="pred-metric-title-row">
              <div class="pred-metric-icon" style="background:${m.color}">${m.icon || '测'}</div>
              <div>
                <div class="pred-metric-name">${nameLabel}健康趋势</div>
                <div class="pred-metric-tag">圆点为直接测量值；模型生成内容明确标为估计值或预测值</div>
              </div>
            </div>
            <span class="pred-metric-badge ${trendClass}">${trendText} · ${predictionModeLabel(predictionMode)}</span>
          </div>
          <div class="pred-metric-svg-wrap">
            <svg id="metric-svg-${m.type}" width="100%" height="300" viewBox="0 0 1060 300" preserveAspectRatio="xMidYMid meet"></svg>
          </div>
          <div class="pred-legend">${buildLegend({
            ...data,
            series: Array.isArray(data.series) ? data.series.map(series => ({
              ...series,
              observed: chartVisibility.raw ? series.observed : [],
              trend: chartVisibility.fitted ? series.trend : [],
              forecast: chartVisibility.forecast ? series.forecast : { ...(series.forecast || {}), points: [] },
            })) : data.series,
            actual: chartVisibility.raw ? (data.actual || []) : [],
            fitted: chartVisibility.fitted ? (data.fitted || []) : [],
            predicted: chartVisibility.forecast ? (data.predicted || []) : [],
            peer: chartVisibility.peer ? (data.peer || []) : [],
          }, '直接测量值', outputLabel, m.color)}</div>
          <div id="population-estimate-${m.type}" class="pred-metric-tag" style="margin-top:10px;padding:10px 12px;border-radius:10px;background:#F7F3ED">正在读取人群模型；短期曲线仍以 Curve V2 为基线。</div>
          <details class="pred-model-details">
            <summary>查看数据和模型详情</summary>
            <div class="pred-quality-row">${quality}<span>输出：${outputLabel}</span><span>模式：${predictionModeLabel(predictionMode)}</span><span>${confidenceText}</span><span>${dateRange}</span><span>${modelText}</span>${backtestText ? `<span>${backtestText}</span>` : ''}${conditionText ? `<span>${conditionText}</span>` : ''}<span>有效点 ${data.analysis?.dataPoints ?? stats?.count ?? 0}</span></div>
            <div class="pred-metric-tag" style="margin-top:8px">${unitLabel ? '单位：' + unitLabel : '定性指标'} · ${peerText} · ${forecastNote}</div>
            <div class="pred-metric-stats">${statsHtml}</div>
          </details>
        </div>
      `;
    }

    function renderMetricChart(svgId, data, m) {
      const svg = document.getElementById(svgId);
      if (!svg) return;

      const primary = data.series?.[0] || {
        id: m.type, label: m.name, unit: m.unit, color: m.color,
        observed: data.actual || [], trend: data.fitted || [],
        forecast: { points: data.predicted || [], available: !!data.predicted?.length },
      };
      const series = Array.isArray(data.series) && data.series.length ? data.series : [primary];
      const actual = primary.observed || data.actual || [];
      const predicted = chartVisibility.forecast ? (primary.forecast?.points || data.predicted || []) : [];
      const peer = Array.isArray(data.peer) ? data.peer : [];
      const unitLabel = m.unit || '';
      const showRaw = chartVisibility.raw;
      const showFitted = chartVisibility.fitted;
      const showPeer = chartVisibility.peer;
      const showForecast = chartVisibility.forecast;

      if (actual.length === 0 && predicted.length === 0) {
        svg.innerHTML = '<text x="50%" y="50%" text-anchor="middle" fill="#9C8B7A" font-size="14" font-family="sans-serif">暂无数据</text>';
        return;
      }

      const W = 1060, H = 300, padL = 62, padR = 34, padT = 34, padB = 46;
      const pointTimestamp = (p, fallback = 0) => pointTime(p, fallback);
      const allSeriesPoints = series.flatMap(s => [
        ...(s.observed || []), ...(s.trend || []), ...(chartVisibility.forecast ? (s.forecast?.points || []) : []),
      ]);
      const timeline = [...new Set(allSeriesPoints.map((p, i) => pointTimestamp(p, i)).filter(Number.isFinite))].sort((a, b) => a - b);
      if (!timeline.length) timeline.push(Date.now());
      const total = timeline.length;
      const tStart = timeline[0] ?? 0;
      const tEnd = timeline[timeline.length - 1] ?? tStart;
      const tSpan = Math.max(tEnd - tStart, 1);

      // 纵轴优先服务个人趋势。原始异常值用边缘点表示，不让单次尖峰压扁整张图。
      const trendVals = series.flatMap(s => [
        ...(s.trend || []).map(p => Number(p.value)),
        ...(chartVisibility.forecast ? (s.forecast?.points || []).flatMap(p => [Number(p.value), Number(p.lower), Number(p.upper)]) : []),
      ]).filter(Number.isFinite);
      const observedVals = series.flatMap(s => (s.observed || []).filter(p => !p.outlier).map(p => Number(p.value))).filter(Number.isFinite);
      const robustObserved = observedVals.length > 12 ? [percentile(observedVals, 0.05), percentile(observedVals, 0.95)] : observedVals;
      const scaleVals = [...trendVals, ...robustObserved];
      if (!scaleVals.length) scaleVals.push(0);

      const yMin = Math.min(...scaleVals);
      const yMax = Math.max(...scaleVals);
      const yRange = Math.max(yMax - yMin, 0.1);
      const yLo = yMin - yRange * 0.12;
      const yHi = yMax + yRange * 0.12;

      // 按真实时间间隔排布，避免长时间缺测被误画成等距连续变化。
      const xToPx = (value) => {
        const timestamp = typeof value === 'number' && value >= tStart - 1 && value <= tEnd + 1 ? value : timeline[value] ?? tStart;
        return padL + (total <= 1 ? (W - padL - padR) / 2 : ((timestamp - tStart) / tSpan) * (W - padL - padR));
      };
      const yToPx = (v, clamp = false) => {
        const value = clamp ? Math.max(yLo, Math.min(yHi, Number(v))) : Number(v);
        return H - padB - ((value - yLo) / (yHi - yLo || 1)) * (H - padT - padB);
      };

      // 分割线
      const firstForecast = predicted[0];
      const dividerX = showForecast && firstForecast ? xToPx(pointTimestamp(firstForecast)) : null;

      const seriesMarkup = series.map((item, seriesIndex) => {
        const color = item.color || (seriesIndex ? '#9C7BC9' : m.color);
        const observed = showRaw ? thinObservedPoints(item.observed || []) : [];
        const trend = showFitted ? (item.trend || []) : [];
        const future = showForecast ? (item.forecast?.points || []) : [];
        const observedDots = observed.map((p, i) => {
          const clipped = Number(p.value) < yLo || Number(p.value) > yHi;
          return `<circle cx="${xToPx(pointTimestamp(p, i))}" cy="${yToPx(p.value, true)}" r="${p.outlier || clipped ? 4.5 : 3.2}" fill="${p.outlier || clipped ? '#A04632' : color}" stroke="#fff" stroke-width="1.4" opacity="0.78"><title>${formatPointTime(p)} · ${p.value}${item.unit ? ` ${item.unit}` : ''}${clipped ? ' · 超出当前显示范围' : ''}${p.measurement_condition && p.measurement_condition !== 'unknown' ? ` · ${p.measurement_condition}` : ''}${p.source ? ` · ${p.source}` : ''}</title></circle>`;
        }).join('');
        const trendPath = monotonePath(trend.map((p, i) => ({ x: xToPx(pointTimestamp(p, i)), y: yToPx(p.value) })));
        const anchor = trend.slice(-1)[0] || observed.slice(-1)[0];
        const forecastPoints = anchor ? [{ ...anchor, recorded_at: anchor.recorded_at }, ...future] : future;
        const forecastPath = monotonePath(forecastPoints.map((p, i) => ({ x: xToPx(pointTimestamp(p, i)), y: yToPx(p.value) })));
        const grade = forecastQuality(item.analysis || data.analysis);
        const forecastOpacity = grade.level === 'baseline' ? 0.58 : grade.level === 'reference' ? 0.76 : 0.95;
        const bandOpacity = grade.level === 'baseline' ? 0.055 : grade.level === 'reference' ? 0.085 : 0.13;
        const band = future.length && future.every(p => Number.isFinite(p.lower) && Number.isFinite(p.upper))
          ? `<polygon points="${anchor && Number.isFinite(anchor.value) ? `${xToPx(pointTimestamp(anchor))},${yToPx(anchor.value, true)} ` : ''}${future.map(p => `${xToPx(pointTimestamp(p))},${yToPx(p.upper, true)}`).join(' ')} ${future.slice().reverse().map(p => `${xToPx(pointTimestamp(p))},${yToPx(p.lower, true)}`).join(' ')}" fill="${color}" opacity="${bandOpacity}"/>` : '';
        const futureDots = future.map((p, i) => `<circle cx="${xToPx(pointTimestamp(p, i))}" cy="${yToPx(p.value, true)}" r="2.8" fill="${color}" stroke="#fff" stroke-width="1"><title>${formatPointTime(p)} · 预测值 ${p.value}${item.unit ? ` ${item.unit}` : ''} · 80%范围 ${p.lower}～${p.upper} · 非直接测量值</title></circle>`).join('');
        return `${showRaw ? observedDots : ''}${showFitted && trendPath ? `<path d="${trendPath}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" opacity="0.95"/>` : ''}${showForecast ? band : ''}${showForecast && forecastPath ? `<path d="${forecastPath}" fill="none" stroke="${color}" stroke-width="2.5" stroke-dasharray="8,5" stroke-linecap="round" opacity="${forecastOpacity}"/>${futureDots}` : ''}`;
      }).join('');

      // 同龄人线
      const peerPolyline = peer.slice(0, total).map((v, i) => `${xToPx(timeline[i])},${yToPx(v)}`).join(' ');

      // Y轴标签
      const yLabels = [yLo, (yLo + yHi) / 2, yHi].map(v => {
        const y = yToPx(v);
        return `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#F0EDE8" stroke-width="1" stroke-dasharray="4,4"/><text x="${padL - 10}" y="${y + 5}" text-anchor="end" fill="#7E7063" font-size="14" font-family="sans-serif">${v.toFixed(1)}</text>`;
      }).join('');

      // 同龄人参考线（虚线）
      const peerRefLine = data.peerBase && Number(data.peerBase.value) >= yLo && Number(data.peerBase.value) <= yHi ? `
        <line x1="${padL}" y1="${yToPx(data.peerBase.value, true)}" x2="${W - padR}" y2="${yToPx(data.peerBase.value, true)}" stroke="#9C8B7A" stroke-width="1" stroke-dasharray="3,5" opacity="0.3"/>
      ` : '';
      const base = primary.baseline || data.baseline;
      const baselineBand = base && Number.isFinite(Number(base.lower)) && Number.isFinite(Number(base.upper)) && Number(base.upper) >= yLo && Number(base.lower) <= yHi
        ? `<rect x="${padL}" y="${yToPx(Number(base.upper), true)}" width="${W - padL - padR}" height="${Math.max(1, yToPx(Number(base.lower), true) - yToPx(Number(base.upper), true))}" fill="${primary.color || m.color}" opacity="0.07"/><text x="${padL + 4}" y="${Math.max(padT + 10, yToPx(Number(base.upper), true) - 4)}" fill="#9C8B7A" font-size="10" font-family="sans-serif">个人基线范围</text>`
        : '';
      const normalBand = !m.dual && Number.isFinite(Number(m.normal_min)) && Number.isFinite(Number(m.normal_max)) && Number(m.normal_max) >= yLo && Number(m.normal_min) <= yHi
        ? `<rect x="${padL}" y="${yToPx(Number(m.normal_max), true)}" width="${W - padL - padR}" height="${Math.max(1, yToPx(Number(m.normal_min), true) - yToPx(Number(m.normal_max), true))}" fill="#7FB069" opacity="0.055"/><text x="${W - padR - 4}" y="${Math.min(H - padB - 4, yToPx(Number(m.normal_max), true) + 12)}" text-anchor="end" fill="#7FB069" font-size="10" font-family="sans-serif">参考范围</text>`
        : '';

      // 数据点
      // 分割线
      const dividerLine = dividerX != null ? `
        <line x1="${dividerX}" y1="${padT}" x2="${dividerX}" y2="${H - padB}" stroke="#E8DCC9" stroke-width="1.5" stroke-dasharray="6,4"/>
        <text x="${dividerX + 4}" y="${padT + 12}" class="pred-divider-label" font-family="sans-serif" fill="#9C8B7A" font-size="10">预测→</text>
      ` : '';
      const forecastShade = dividerX != null
        ? `<rect x="${dividerX}" y="${padT}" width="${W - padR - dividerX}" height="${H - padT - padB}" fill="#2563EB" opacity="0.035"/>`
        : '';
      const historicalTimelineLength = firstForecast ? timeline.filter(t => t < pointTimestamp(firstForecast)).length : timeline.length;
      const timeAxis = buildTimeAxis(timeline, xToPx, padT, H - padB, historicalTimelineLength, showForecast ? predicted.length : 0);

      svg.innerHTML = `
        ${yLabels}
        ${showPeer ? peerRefLine : ''}
        ${normalBand}
        ${baselineBand}
        <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="#E8DCC9" stroke-width="1"/>
        <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}" stroke="#E8DCC9" stroke-width="1"/>
        <!-- 同龄人线 -->
        ${showPeer ? `<polyline points="${peerPolyline}" fill="none" stroke="#9C8B7A" stroke-width="2" stroke-linecap="round" opacity="0.4"/>` : ''}
        <!-- 原始测量值只用散点显示，避免把异常点连成不真实的尖峰折线 -->
        ${timeAxis}
        ${showForecast ? forecastShade : ''}
        ${seriesMarkup}
        ${showForecast ? dividerLine : ''}
      `;
      attachSvgTooltip(svg);
    }
  </script>
</body>
</html>
