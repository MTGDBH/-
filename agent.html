<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能管家 · 小康·健康管家</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="agent-page">
  <div id="app-nav"></div>

  <main class="main agent-main">
    <header class="page-head agent-page-head">
      <div>
        <h1>智能管家</h1>
        <p class="subtitle">直接说出您的问题，小康会自动选择合适的健康能力</p>
      </div>
      <div class="agent-page-actions">
        <a class="btn btn-secondary" id="agent-intervention-link" href="intervention.html">我的改善计划</a>
        <button type="button" class="agent-daily-plan-button" id="agent-daily-plan">生成今日健康方案</button>
      </div>
    </header>

    <section class="agent-context-bar" aria-label="智能体上下文">
      <div class="agent-context-fields">
        <label id="agent-subject-wrap" hidden>选择老人
          <select id="agent-subject"></select>
        </label>
        <label>当前对话
          <select id="agent-conversation"></select>
        </label>
      </div>
      <div class="agent-context-actions">
        <button type="button" class="btn btn-secondary" id="agent-new-conversation">＋ 新对话</button>
        <button type="button" class="btn btn-ghost" id="agent-memory-button">已记住的信息</button>
      </div>
      <span class="agent-context-note" id="agent-context-note">健康数据每次实时读取，不使用过期预测</span>
    </section>

    <section class="agent-layout-toolbar" aria-label="工作区布局">
      <div class="agent-layout-copy"><strong>工作区大小</strong><span>拖动中间边界调整宽度，拖动下方边界统一调整高度</span></div>
      <div class="agent-layout-presets" role="group" aria-label="选择工作区比例">
        <button type="button" data-agent-layout-ratio="0.72">对话优先</button>
        <button type="button" data-agent-layout-ratio="0.64" class="active">均衡布局</button>
        <button type="button" data-agent-layout-ratio="0.56">辅助区优先</button>
        <button type="button" id="agent-height-decrease" aria-label="降低左右工作区高度">高度－</button>
        <button type="button" id="agent-height-increase" aria-label="增加左右工作区高度">高度＋</button>
        <button type="button" id="agent-layout-reset">恢复自适应</button>
      </div>
    </section>

    <section class="agent-row">
      <div class="chat-area">
        <header class="agent-chat-head"><div><span>健康对话</span><h2>和小康聊一聊</h2></div><small>按问题实时读取相关健康数据</small></header>
        <div class="chat-history" id="chat-history"></div>
        <div class="agent-chat-composer">
          <div class="quick-prompts" id="quick-prompts"></div>
          <div class="chat-input-bar">
            <input class="input chat-input" id="chat-input" placeholder="你想问点什么…" />
            <button class="btn-icon" id="btn-send" style="background:var(--c-primary);color:#fff;border:none">→</button>
          </div>
        </div>
      </div>

      <div class="agent-splitter" id="agent-splitter" role="separator" aria-label="调整聊天区和辅助区宽度" aria-orientation="vertical" aria-valuemin="50" aria-valuemax="78" aria-valuenow="69" tabindex="0" title="左右拖动调整宽度，双击恢复默认">
        <span aria-hidden="true">⋮</span>
      </div>

      <aside class="plan-area" aria-label="今日健康辅助区">
        <div class="plan-header">
          <div><span class="agent-side-eyebrow">今日辅助</span><span class="plan-title">今日健康安排</span></div>
          <span class="plan-badge" id="plan-count">— 项</span>
        </div>
        <div class="plan-sub">AI 实时生成 · <span id="plan-today">—</span></div>
        <section class="agent-inbox agent-inbox-sidebar" id="agent-inbox" aria-live="polite" hidden>
          <button type="button" class="agent-inbox-head" id="agent-inbox-toggle" aria-expanded="false" aria-controls="agent-inbox-list">
            <div><span>站内主动提醒</span><h2>待处理健康事项</h2></div>
            <strong id="agent-inbox-count">0 项</strong>
            <i aria-hidden="true">⌄</i>
          </button>
          <div class="agent-inbox-list" id="agent-inbox-list"></div>
        </section>
        <div id="plan-list"></div>
        <section class="agent-daily-tip" id="agent-daily-tip" aria-live="polite">
          <div class="agent-daily-tip-head"><div><span>健康知识</span><h2>今日健康贴士</h2></div><strong id="daily-tip-status">读取中</strong></div>
          <div id="daily-tip-content" class="agent-daily-tip-content"><span class="loading"></span> 正在准备今日贴士…</div>
        </section>
      </aside>
    </section>
    <div class="agent-workspace-height-resizer" id="agent-workspace-height-resizer" role="separator" aria-label="统一调整左右工作区高度" aria-orientation="horizontal" aria-valuemin="560" aria-valuemax="1100" tabindex="0" title="上下拖动调整工作区高度，双击恢复默认"><span aria-hidden="true">上下调整</span></div>
    <section class="agent-memory-panel" id="agent-memory-panel" hidden>
      <div class="agent-memory-head"><div><h2>已记住的信息</h2><p>只保存你确认过的偏好和照护信息，不保存健康数值或疾病概率。</p></div><button type="button" id="agent-memory-close">关闭</button></div>
      <div id="agent-memory-list" class="agent-memory-list"></div>
    </section>
  </main>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener('auth:ready', async () => {
      bindTabs();
      bindSend();
      bindPrompts();
      bindMsgActions();
      bindPlanActions();
      bindAgentContext();
      bindAgentSplitter();
      bindAgentWorkspaceHeight();
      renderQuickPrompts();
      await initAgentContext();
      loadPlan();
      loadInbox();
      loadDailyTip();
    });
    Auth.init();

    const PROMPTS = ['看看我的总体健康', '看看最近血压', '生成今日健康方案', '我想问一个健康问题'];
    const AGENT_SPLIT_KEY = 'xiaokang-agent-split-ratio-v2';
    const AGENT_WORKSPACE_HEIGHT_KEY = 'xiaokang-agent-workspace-height-v3';

    function bindAgentSplitter() {
      const row = document.querySelector('.agent-row');
      const splitter = document.getElementById('agent-splitter');
      if (!row || !splitter || splitter.dataset.bound === '1') return;
      splitter.dataset.bound = '1';
      let dragging = false;
      let ratio = Number(localStorage.getItem(AGENT_SPLIT_KEY));
      if (!Number.isFinite(ratio)) ratio = 0.64;

      const clampRatio = value => Math.max(0.54, Math.min(0.74, Number(value) || 0.64));
      const isStacked = () => window.matchMedia('(max-width: 1260px)').matches;
      function applyRatio(next, persist = false) {
        ratio = clampRatio(next);
        if (isStacked()) {
          row.style.removeProperty('--agent-chat-width');
        } else {
          const available = Math.max(0, row.getBoundingClientRect().width - splitter.offsetWidth);
          const minRatio = Math.max(0.54, Math.min(0.62, 620 / Math.max(1, available)));
          const maxRatio = Math.min(0.74, Math.max(0.64, 1 - 390 / Math.max(1, available)));
          ratio = Math.max(minRatio, Math.min(maxRatio, ratio));
          row.style.setProperty('--agent-chat-width', `${Math.round(available * ratio)}px`);
          splitter.setAttribute('aria-valuemin', String(Math.round(minRatio * 100)));
          splitter.setAttribute('aria-valuemax', String(Math.round(maxRatio * 100)));
        }
        splitter.setAttribute('aria-valuenow', String(Math.round(ratio * 100)));
        splitter.setAttribute('aria-valuetext', `聊天区约占${Math.round(ratio * 100)}%`);
        document.querySelectorAll('[data-agent-layout-ratio]').forEach(button => button.classList.toggle('active', Math.abs(Number(button.dataset.agentLayoutRatio) - ratio) < 0.025));
        if (persist) localStorage.setItem(AGENT_SPLIT_KEY, ratio.toFixed(4));
      }
      function ratioFromPointer(event) {
        const rect = row.getBoundingClientRect();
        const available = Math.max(1, rect.width - splitter.offsetWidth);
        return (event.clientX - rect.left) / available;
      }
      splitter.addEventListener('pointerdown', event => {
        if (isStacked()) return;
        dragging = true;
        splitter.setPointerCapture(event.pointerId);
        document.body.classList.add('agent-is-resizing');
        event.preventDefault();
      });
      splitter.addEventListener('pointermove', event => {
        if (!dragging) return;
        applyRatio(ratioFromPointer(event));
      });
      const finishDrag = event => {
        if (!dragging) return;
        dragging = false;
        if (splitter.hasPointerCapture?.(event.pointerId)) splitter.releasePointerCapture(event.pointerId);
        document.body.classList.remove('agent-is-resizing');
        applyRatio(ratio, true);
      };
      splitter.addEventListener('pointerup', finishDrag);
      splitter.addEventListener('pointercancel', finishDrag);
      splitter.addEventListener('dblclick', () => applyRatio(0.64, true));
      splitter.addEventListener('keydown', event => {
        if (isStacked()) return;
        if (!['ArrowLeft', 'ArrowRight', 'Home'].includes(event.key)) return;
        applyRatio(event.key === 'Home' ? 0.64 : ratio + (event.key === 'ArrowLeft' ? -0.02 : 0.02), true);
        event.preventDefault();
      });
      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => applyRatio(ratio), 80);
      });
      document.querySelectorAll('[data-agent-layout-ratio]').forEach(button => button.addEventListener('click', () => applyRatio(Number(button.dataset.agentLayoutRatio), true)));
      document.getElementById('agent-layout-reset')?.addEventListener('click', () => {
        localStorage.removeItem(AGENT_SPLIT_KEY);
        applyRatio(0.64);
      });
      applyRatio(ratio);
    }

    function bindAgentWorkspaceHeight() {
      const row = document.querySelector('.agent-row');
      const handle = document.getElementById('agent-workspace-height-resizer');
      if (!row || !handle || handle.dataset.bound === '1') return;
      handle.dataset.bound = '1';
      const isStacked = () => window.matchMedia('(max-width: 1260px)').matches;
      const defaultHeight = () => Math.max(620, Math.min(900, Math.round(window.innerHeight - 300)));
      const clamp = value => Math.max(560, Math.min(1100, Math.round(Number(value) || defaultHeight())));
      let height = clamp(Number(localStorage.getItem(AGENT_WORKSPACE_HEIGHT_KEY)) || defaultHeight());
      let dragging = false;
      let startY = 0;
      let startHeight = height;

      function applyHeight(next, persist = false) {
        height = clamp(next);
        if (isStacked()) row.style.removeProperty('--agent-workspace-height');
        else row.style.setProperty('--agent-workspace-height', `${height}px`);
        handle.setAttribute('aria-valuenow', String(height));
        handle.setAttribute('aria-valuetext', `工作区高度约${height}像素`);
        if (persist) localStorage.setItem(AGENT_WORKSPACE_HEIGHT_KEY, String(height));
      }
      handle.addEventListener('pointerdown', event => {
        if (isStacked()) return;
        dragging = true;
        startY = event.clientY;
        startHeight = row.getBoundingClientRect().height;
        handle.setPointerCapture(event.pointerId);
        document.body.classList.add('agent-is-resizing-height');
        event.preventDefault();
      });
      handle.addEventListener('pointermove', event => {
        if (dragging) applyHeight(startHeight + event.clientY - startY);
      });
      const finish = event => {
        if (!dragging) return;
        dragging = false;
        if (handle.hasPointerCapture?.(event.pointerId)) handle.releasePointerCapture(event.pointerId);
        document.body.classList.remove('agent-is-resizing-height');
        applyHeight(height, true);
      };
      handle.addEventListener('pointerup', finish);
      handle.addEventListener('pointercancel', finish);
      handle.addEventListener('dblclick', () => {
        localStorage.removeItem(AGENT_WORKSPACE_HEIGHT_KEY);
        applyHeight(defaultHeight());
      });
      handle.addEventListener('keydown', event => {
        if (isStacked() || !['ArrowUp', 'ArrowDown', 'Home'].includes(event.key)) return;
        applyHeight(event.key === 'Home' ? defaultHeight() : height + (event.key === 'ArrowUp' ? -30 : 30), true);
        event.preventDefault();
      });
      document.getElementById('agent-layout-reset')?.addEventListener('click', () => {
        localStorage.removeItem(AGENT_WORKSPACE_HEIGHT_KEY);
        applyHeight(defaultHeight());
      });
      document.getElementById('agent-height-decrease')?.addEventListener('click', () => applyHeight(height - 80, true));
      document.getElementById('agent-height-increase')?.addEventListener('click', () => applyHeight(height + 80, true));
      window.addEventListener('resize', () => applyHeight(height));
      applyHeight(height);
    }

    let lastUserMessage = '';
    let ttsUtterance = null;
    let me = null;
    let subjectId = null;
    let conversationId = null;

    const agentQuery = () => `subject_user_id=${encodeURIComponent(subjectId)}${conversationId ? `&conversation_id=${encodeURIComponent(conversationId)}` : ''}`;
    const requestId = () => (globalThis.crypto?.randomUUID?.() || `web-${Date.now()}-${Math.random().toString(36).slice(2)}`);

    function bindAgentContext() {
      document.getElementById('agent-subject').addEventListener('change', async e => {
        subjectId = Number(e.target.value); conversationId = null;
        syncInterventionLink();
        await loadConversations(); await Promise.all([loadChat(), loadMemories(), loadPlan(), loadInbox(), loadDailyTip()]);
      });
      document.getElementById('agent-conversation').addEventListener('change', async e => { conversationId = Number(e.target.value); await Promise.all([loadChat(), loadPlan()]); });
      document.getElementById('agent-new-conversation').addEventListener('click', async () => {
        const created = await API.post('/api/chat/conversations', { subject_user_id: subjectId, title: '新对话' });
        conversationId = created.id; await loadConversations(); await Promise.all([loadChat(), loadPlan()]);
      });
      document.getElementById('agent-memory-button').addEventListener('click', async () => { document.getElementById('agent-memory-panel').hidden = false; await loadMemories(); });
      document.getElementById('agent-memory-close').addEventListener('click', () => { document.getElementById('agent-memory-panel').hidden = true; });
      document.getElementById('agent-memory-list').addEventListener('click', handleMemoryAction);
      document.getElementById('agent-inbox').addEventListener('click', handleInboxAction);
      document.getElementById('agent-inbox-toggle').addEventListener('click', toggleInboxPanel);
      document.getElementById('agent-daily-plan').addEventListener('click', () => {
        document.getElementById('chat-input').value = '请根据我当前的健康记录生成今日健康方案';
        send();
      });
    }

    async function initAgentContext() {
      me = await API.get('/api/auth/me'); subjectId = me.id;
      syncInterventionLink();
      let relationships = { as_member: [] };
      try { relationships = await API.get('/api/care/relationships'); } catch {}
      if (relationships.as_member?.length) {
        const wrap = document.getElementById('agent-subject-wrap'); wrap.hidden = false;
        document.getElementById('agent-subject').innerHTML = `<option value="${me.id}">${escapeHTML(me.name)}（本人）</option>` + relationships.as_member.filter(x => x.status === 'active').map(x => `<option value="${x.senior_id}">${escapeHTML(x.name)}（已授权）</option>`).join('');
      }
      await loadConversations(); await Promise.all([loadChat(), loadMemories()]);
    }

    function syncInterventionLink() {
      const link = document.getElementById('agent-intervention-link');
      if (link && subjectId) link.href = `intervention.html?subject_user_id=${encodeURIComponent(subjectId)}`;
    }

    async function loadConversations() {
      let data = await API.get(`/api/chat/conversations?subject_user_id=${subjectId}`);
      if (!data.items?.some(x => x.status === 'active')) {
        const created = await API.post('/api/chat/conversations', { subject_user_id: subjectId, title: '健康对话' });
        data.items = [created, ...(data.items || [])];
      }
      if (!conversationId || !data.items.some(x => Number(x.id) === Number(conversationId) && x.status === 'active')) conversationId = data.items.find(x => x.status === 'active').id;
      document.getElementById('agent-conversation').innerHTML = data.items.map(x => `<option value="${x.id}" ${Number(x.id)===Number(conversationId)?'selected':''} ${x.status==='archived'?'disabled':''}>${escapeHTML(x.title)}${x.status==='archived'?'（已归档）':''}</option>`).join('');
      document.getElementById('agent-context-note').textContent = `正在分析：${data.subject?.name || me.name} · 健康数据实时读取`;
    }

    async function loadMemories() {
      if (!subjectId) return;
      const data = await API.get(`/api/agent/memories?subject_user_id=${subjectId}`);
      const host = document.getElementById('agent-memory-list');
      host.innerHTML = data.items?.length ? data.items.map(memory => `<article class="agent-memory-item status-${memory.status}"><div><span>${memory.status==='candidate'?'待你确认':'已经记住'}</span><strong>${escapeHTML(memory.content)}</strong><small>${escapeHTML(memory.category)}</small></div><div>${memory.status==='candidate'?`<button data-memory-action="confirm" data-id="${memory.id}">记住</button><button data-memory-action="reject" data-id="${memory.id}">不保存</button>`:`<button data-memory-action="delete" data-id="${memory.id}">删除</button>`}</div></article>`).join('') : '<div class="empty">还没有确认过的长期记忆。</div>';
    }

    function metricValue(row) {
      if (!row) return '—';
      return `${row.value}${row.value2 != null ? '/' + row.value2 : ''}${row.unit ? ' ' + row.unit : ''}`;
    }

    function setInboxExpanded(expanded, remember = false) {
      const box = document.getElementById('agent-inbox');
      const toggle = document.getElementById('agent-inbox-toggle');
      box.classList.toggle('is-collapsed', !expanded);
      toggle.setAttribute('aria-expanded', String(expanded));
      if (remember) box.dataset.userExpanded = expanded ? '1' : '0';
    }

    function toggleInboxPanel(event) {
      event.stopPropagation();
      const box = document.getElementById('agent-inbox');
      setInboxExpanded(box.classList.contains('is-collapsed'), true);
    }

    function conditionLabel(value) {
      return ({ morning_rest: '早晨静坐后', evening_rest: '晚间静坐后', fasting: '空腹', postprandial_2h: '餐后2小时', random: '随机', resting: '静息', active: '活动后', morning_fasting: '晨起空腹', unknown: '测量条件未填写' }[value] || value || '测量条件未填写');
    }

    function renderFollowupComparison(item) {
      const c = item.comparison;
      if (!c) return '';
      return `<div class="followup-comparison"><strong>复测对比</strong><div><span>上次 ${escapeHTML(metricValue(c.baseline))}</span><b>→</b><span>本次 ${escapeHTML(metricValue(c.result))}</span></div><p>${escapeHTML(c.comparison_note || '')}</p><p>${escapeHTML(c.action || '')}</p></div>`;
    }

    async function loadInbox() {
      if (!subjectId) return;
      const box = document.getElementById('agent-inbox'), host = document.getElementById('agent-inbox-list');
      try {
        const data = await API.get(`/api/agent/inbox?subject_user_id=${subjectId}`);
        const active = [...(data.pending_result_confirmation || []), ...(data.overdue || []), ...(data.due || []), ...(data.scheduled || [])];
        const completed = data.recently_completed?.find(item => item.comparison);
        if (!active.length && !completed) { box.hidden = true; return; }
        box.hidden = false;
        document.getElementById('agent-inbox-count').textContent = `${active.length} 项待处理`;
        const needsImmediateAttention = (data.pending_result_confirmation || []).length > 0 || (data.overdue || []).length > 0;
        const remembered = box.dataset.userExpanded;
        setInboxExpanded(needsImmediateAttention || remembered === '1');
        const activeHtml = active.map(item => {
          const candidate = item.status === 'pending_result_confirmation' && item.candidate;
          const level = item.status === 'overdue' ? '已逾期' : item.status === 'due' ? '已到期' : candidate ? '待确认复测' : '已安排';
          return `<article class="agent-inbox-item status-${escapeHTML(item.status)}"><div class="agent-inbox-item-head"><span>${level}</span><strong>${escapeHTML(item.label || item.metric_type || '复测')}</strong><time>${escapeHTML(new Date(item.due_at).toLocaleString('zh-CN'))}</time></div>
            ${candidate ? `<div class="followup-pair"><div><small>基线记录</small><strong>${escapeHTML(metricValue(item.baseline))}</strong><p>${escapeHTML(conditionLabel(item.baseline?.measurement_condition))}</p></div><div><small>新测量</small><strong>${escapeHTML(metricValue(item.candidate))}</strong><p>${escapeHTML(conditionLabel(item.candidate?.measurement_condition))}</p></div></div>${renderFollowupComparison(item)}<div class="agent-inbox-actions"><button data-inbox-action="confirm-candidate" data-followup-id="${item.id}" data-metric-id="${item.candidate.id}">是本次复测</button><button data-inbox-action="reject-candidate" data-followup-id="${item.id}" data-metric-id="${item.candidate.id}">不是这次</button></div>` : `<p>请按相同条件完成${escapeHTML(item.label || '指标')}测量，新记录会先请您确认。</p><div class="agent-inbox-actions"><a class="btn" href="prediction.html?tab=trend&type=${encodeURIComponent(item.metric_type || '')}">去记录</a><button data-inbox-action="cancel" data-followup-id="${item.id}">取消复测</button></div>`}
          </article>`;
        }).join('');
        host.innerHTML = activeHtml + (completed ? `<article class="agent-inbox-item completed"><div class="agent-inbox-item-head"><span>最近完成</span><strong>${escapeHTML(completed.label)}</strong></div>${renderFollowupComparison(completed)}</article>` : '');
      } catch (error) { box.hidden = true; }
    }

    async function handleInboxAction(e) {
      const btn = e.target.closest('[data-inbox-action]'); if (!btn) return;
      const id = btn.dataset.followupId, metricId = Number(btn.dataset.metricId);
      try {
        if (btn.dataset.inboxAction === 'confirm-candidate') await API.post(`/api/actions/followups/${id}/candidate/confirm`, { metric_id: metricId });
        else if (btn.dataset.inboxAction === 'reject-candidate') await API.post(`/api/actions/followups/${id}/candidate/reject`, { metric_id: metricId });
        else if (btn.dataset.inboxAction === 'cancel' && window.confirm('确认取消这项复测吗？')) await API.post(`/api/actions/followups/${id}/cancel`, {});
        else return;
        await loadInbox(); toast('复测状态已更新', 'success');
      } catch (error) { toast(error.message, 'error'); }
    }

    async function handleMemoryAction(e) {
      const btn = e.target.closest('[data-memory-action]'); if (!btn) return;
      const id = btn.dataset.id, action = btn.dataset.memoryAction;
      try {
        if (action === 'delete') await API.delete(`/api/agent/memories/${id}`);
        else await API.post(`/api/agent/memories/${id}/${action}`, {});
        await loadMemories(); toast(action === 'confirm' ? '已记住，可随时删除' : '已更新记忆', 'success');
      } catch (error) { toast(error.message, 'error'); }
    }

    function bindSend() {
      document.getElementById('btn-send').addEventListener('click', send);
      document.getElementById('chat-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') send();
      });
    }

    async function loadChat() {
      const hist = document.getElementById('chat-history');
      try {
        const msgs = await API.get(`/api/chat/history?${agentQuery()}`);
        if (!msgs.length) {
          hist.innerHTML = renderMsg({
            role: 'assistant',
            content: '您好，我是小康，您的健康管家。想了解今天的身体状况吗？',
            plan: null,
            confidence: { type: 'common_sense' }
          });
          return;
        }
        hist.innerHTML = msgs.map(renderMsg).join('');
        scrollChat();
      } catch (err) {
        hist.innerHTML = `<div class="empty">对话读取失败：${escapeHTML(err.message)}</div>`;
      }
    }

    function confidenceScoreClass(score) {
      if (score >= 80) return 'score-high';
      if (score >= 60) return 'score-mid';
      return 'score-low';
    }

    const metricDisplayNames = {
      systo: '高压（收缩压）', diasto: '低压（舒张压）', bp: '血压', pulse: '心率', hr: '心率',
      glucose: '血糖', weight: '体重', sleep: '睡眠', steps: '步数', spo2: '血氧', temp: '体温',
      resp: '呼吸频率', bmi: '体重指数', hba1c: '糖化血红蛋白', cholesterol: '胆固醇', uricacid: '尿酸'
    };
    const toolDisplayNames = {
      health_trend: '健康趋势', htn_risk: '高血压风险筛查', disease_risk: '疾病风险筛查',
      behavior: '睡眠与活动', device: '设备状态', health_summary: '健康摘要', alerts: '待处理预警',
      knowledge: '健康知识依据', followup_status: '复测随访'
    };
    function displayMetric(value) {
      const key = String(value || '').trim().toLowerCase();
      return metricDisplayNames[key] || String(value || '健康指标');
    }
    function inferActionMetric(action = {}, context = '') {
      if (action.metric_type) return String(action.metric_type).toLowerCase();
      const text = `${action.title || ''} ${action.description || action.desc || ''} ${context || ''}`;
      if (/血压|高压|低压/.test(text)) return 'bp';
      if (/血糖/.test(text)) return 'glucose';
      if (/心率|脉搏/.test(text)) return 'hr';
      if (/体重/.test(text)) return 'weight';
      if (/睡眠/.test(text)) return 'sleep';
      if (/血氧/.test(text)) return 'spo2';
      if (/体温/.test(text)) return 'temp';
      if (/呼吸/.test(text)) return 'resp';
      return '';
    }
    function normalizeVisiblePlan(action = {}, context = '') {
      return { ...action, metric_type: inferActionMetric(action, context) };
    }
    function isValidVisiblePlan(action = {}) {
      return action.action_type !== 'schedule_recheck' || !!inferActionMetric(action);
    }
    function renderActionMetric(action = {}) {
      if (action.action_type !== 'schedule_recheck') return '';
      const metricType = inferActionMetric(action);
      return `<span class="agent-action-metric ${metricType ? '' : 'is-missing'}">复测项目：${escapeHTML(metricType ? displayMetric(metricType) : '尚未明确')}</span>`;
    }
    function displayUnit(value) {
      const raw = String(value || '').trim();
      return ({ mmHg:'毫米汞柱', bpm:'次/分', kg:'千克', 'mmol/L':'毫摩尔/升', h:'小时' })[raw] || raw;
    }
    function visibleChinese(value) {
      return String(value ?? '')
        .replace(/\bsysto\b/gi, metricDisplayNames.systo).replace(/\bdiasto\b/gi, metricDisplayNames.diasto)
        .replace(/\bpulse\b/gi, metricDisplayNames.pulse).replace(/\bglucose\b/gi, metricDisplayNames.glucose)
        .replace(/\bweight\b/gi, metricDisplayNames.weight).replace(/\bsleep\b/gi, metricDisplayNames.sleep)
        .replace(/\bsteps\b/gi, metricDisplayNames.steps).replace(/\bspo2\b/gi, metricDisplayNames.spo2)
        .replace(/\bresp\b/gi, metricDisplayNames.resp).replace(/\btemp\b/gi, metricDisplayNames.temp)
        .replace(/\bBMI\b/g, metricDisplayNames.bmi).replace(/\bHbA1c\b/gi, metricDisplayNames.hba1c)
        .replace(/mmHg/gi, '毫米汞柱').replace(/mmol\s*\/\s*L/gi, '毫摩尔/升')
        .replace(/\bbpm\b/gi, '次/分').replace(/\bkg\b/gi, '千克');
    }
    function displayTool(item) { return item?.label || toolDisplayNames[item?.name] || '健康数据读取'; }

    function renderActions(m) {
      if (m.role !== 'assistant') return '';
      const conf = m.confidence || { type: 'common_sense' };
      const isData = conf.type === 'data' && conf.score != null;
      const msgId = m.id || ('msg-' + Math.random().toString(36).slice(2, 9));
      const contentEscaped = encodeURIComponent(visibleChinese(m.content || ''));

      let confidenceHtml = '';
      if (isData) {
        const cls = confidenceScoreClass(conf.score);
        confidenceHtml = `
          <button class="msg-action-btn confidence-btn ${cls}" data-action="confidence" data-msg-id="${msgId}"
                  data-score="${conf.score}" data-sources='${JSON.stringify(conf.sources || []).replace(/'/g, "&#39;")}'
                  data-reasoning="${escapeHTML(conf.reasoning || '')}"
                  title="查看可信度评分细则">
            <span class="score-ring">${conf.score}</span>
            可信度
          </button>`;
      } else {
        confidenceHtml = `
          <span class="common-sense-tag">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 16v-4M12 8h.01"/>
            </svg>
            常识
          </span>`;
      }

      return `
        <div class="msg-actions" data-msg-id="${msgId}">
          <button class="msg-action-btn" data-action="copy" data-content="${contentEscaped}" title="复制">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            复制
          </button>
          <button class="msg-action-btn ${m.feedback?.rating==='like'?'active like':''}" data-action="like" title="赞">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>
            </svg>
            赞
          </button>
          <button class="msg-action-btn ${m.feedback?.rating==='dislike'?'active':''}" data-action="dislike" title="踩">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/>
            </svg>
            踩
          </button>
          <span class="msg-action-sep"></span>
          <button class="msg-action-btn" data-action="tts" data-content="${contentEscaped}" title="朗读">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
            </svg>
            朗读
          </button>
          <button class="msg-action-btn" data-action="regenerate" data-msg-id="${msgId}" title="重新生成">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"/>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
            重新生成
          </button>
          ${confidenceHtml}
        </div>`;
    }

    function renderEvidenceBody(evidence) {
      if (!evidence || ((!Array.isArray(evidence.items) || !evidence.items.length) && !evidence.graph)) return '';
      const trendName = { rising: '上升', falling: '下降', stable: '基本稳定', unknown: '暂不判断' };
      const rows = (evidence.items || []).slice(0, 4).map(item => {
        const value = item.latest_value == null ? '—' : `${item.latest_value}${item.unit ? ' ' + displayUnit(item.unit) : ''}`;
        const date = item.measured_at ? new Date(item.measured_at).toLocaleDateString('zh-CN') : '—';
        return `<div style="display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #f2e9df">
          <span style="color:#6f6257">${escapeHTML(displayMetric(item.metric))} · ${escapeHTML(date)}</span>
          <span style="color:#3d2e1f;font-weight:600">${escapeHTML(value)} · ${escapeHTML(trendName[item.trend] || '暂不判断')}</span>
        </div>`;
      }).join('');
      const graph = evidence.graph;
      const graphCitations = graph?.citations?.slice?.(0, 3) || [];
      const graphReasons = graph?.personalization?.why_this_user?.slice?.(0, 2) || [];
      const graphHtml = graph ? `<div style="margin-top:8px;padding-top:7px;border-top:1px dashed #ead8c7">
        <div style="font-weight:700;color:#7d5b40">知识依据 · 本地健康知识检索</div>
        ${graphCitations.map(c => { const label = typeof c === 'string' ? c : (c.label || c.citation || '知识来源'); const url = typeof c === 'object' ? c.url : ''; return `<div style="margin-top:3px;color:#6f6257">${url ? `<a href="${escapeHTML(url)}" target="_blank" rel="noopener" style="color:#8a6b51;text-decoration:underline">${escapeHTML(label)}</a>` : escapeHTML(label)}</div>`; }).join('')}
        ${graphReasons.length ? `<div style="margin-top:5px;color:#8a6b51">为什么针对您：${graphReasons.map(escapeHTML).join('；')}</div>` : ''}
      </div>` : '';
      const quality = evidence.data_quality;
      const qualityHtml = quality ? `<div class="agent-evidence-quality">数据完整度：${Math.round(Number(quality.ratio || 0) * 100)}%${Number(quality.measurement_condition_missing || 0) ? ` · ${Number(quality.measurement_condition_missing)} 条记录缺少测量条件` : ''}</div>` : '';
      return `<div class="agent-evidence-body">
        ${rows ? `<div style="font-weight:700;color:#9a6a42;margin-bottom:3px">依据 · 后端真实健康数据</div>
        <div style="color:#9c8b7a;margin-bottom:4px">近${Number(evidence.period_days || 90)}天，共 ${Number(evidence.data_points || 0)} 条记录</div>` : ''}
        ${qualityHtml}
        ${rows}
        ${evidence.missing_metrics && evidence.missing_metrics.length ? `<div style="color:#a87952;margin-top:6px">缺少：${escapeHTML(evidence.missing_metrics.map(displayMetric).join('、'))}</div>` : ''}
        ${graphHtml}
      </div>`;
    }

    function renderEvidence(evidence) {
      const body = renderEvidenceBody(evidence);
      if (!body) return '';
      return `<details class="agent-evidence"><summary>查看数据与知识依据</summary>${body}</details>`;
    }

    function renderToolTrace(m) {
      const trace = m.tool_trace || m.evidence?.tool_trace || [];
      if (!trace.length) return '';
      return `<div class="agent-tool-trace"><strong>本次读取依据</strong>${trace.map(item => `<span class="${item.status==='success'?'ok':'error'}">${escapeHTML(displayTool(item))} · ${item.status==='success'?'已完成':'暂不可用'}${item.freshness?` · ${escapeHTML(new Date(item.freshness).toLocaleDateString('zh-CN'))}`:''}</span>`).join('')}</div>`;
    }

    function renderMemoryCandidates(m) {
      const rows = m.memory_candidates || [];
      if (!rows.length) return '';
      return rows.map(memory => `<div class="agent-memory-candidate"><div><strong>要记住这件事吗？</strong><p>${escapeHTML(memory.content)}</p></div><button data-memory-action="confirm" data-id="${memory.id}">记住</button><button data-memory-action="reject" data-id="${memory.id}">不保存</button></div>`).join('');
    }

    function renderPlanControl(p) {
      const metricType = inferActionMetric(p);
      const interventionPayload = p.intervention_payload ? encodeURIComponent(JSON.stringify(p.intervention_payload)) : '';
      const adherencePayload = p.adherence_payload ? encodeURIComponent(JSON.stringify(p.adherence_payload)) : '';
      const attrs = `data-action-type="${p.action_type || ''}" data-title="${encodeURIComponent(p.title)}" data-desc="${encodeURIComponent(p.desc || p.description || '')}" data-metric-type="${metricType}" data-baseline-metric-id="${p.baseline_metric_id || ''}" data-intervention-id="${p.intervention_id || ''}" data-intervention-payload="${interventionPayload}" data-adherence-payload="${adherencePayload}"`;
      const schedule = p.action_type === 'schedule_recheck' ? `<div class="agent-schedule-picker" aria-label="选择复测时间"><div class="agent-schedule-head"><strong>选择复测时间</strong><span>选择后再确认，不会自动保存</span></div><div class="agent-schedule-options">${(p.schedule_options || [{key:'later_today',label:'今天稍后'},{key:'tomorrow_morning',label:'明早'},{key:'custom',label:'自选时间'}]).map((item,index) => `<button type="button" data-schedule-key="${item.key}" class="${index===1?'selected':''}">${escapeHTML(item.label)}</button>`).join('')}</div><input type="datetime-local" aria-label="自选复测时间" hidden></div>` : '';
      const detail = p.action_type === 'n_of_1_intervention' && p.proposal_details ? `<div class="agent-intervention-details">
        <p><strong>做什么：</strong>${escapeHTML(p.proposal_details.what || '')}</p><p><strong>做多久：</strong>${escapeHTML(p.proposal_details.duration || '')}</p>
        <p><strong>如何记录：</strong>${escapeHTML(p.proposal_details.recording || '')}</p><p><strong>何时复测：</strong>${escapeHTML(p.proposal_details.recheck || '')}</p>
        <p><strong>观察指标：</strong>${escapeHTML(p.proposal_details.target_metric || '')}</p><p><strong>为什么：</strong>${escapeHTML(p.proposal_details.why || '')}</p>
        <p><strong>证据来源：</strong>${(p.proposal_details.evidence_sources || []).map(x => escapeHTML(x.label || x.title || '')).join('；')}</p>
        <p><strong>停止并就医：</strong>${escapeHTML(p.proposal_details.stop_and_seek_care || '')}</p></div>` : '';
      if (p.requires_confirmation || p.action_type) return `${detail}${schedule}<div class="agent-action-preview-controls"><button data-action="plan" ${attrs}>${p.action_type === 'n_of_1_intervention' ? '确认创建干预' : p.action_type === 'record_adherence' ? '确认记录' : '确认安排'}</button><button data-action="dismiss-plan">${p.action_type === 'n_of_1_intervention' ? '拒绝方案' : '暂不安排'}</button></div>`;
      return `<button class="plan-card-check" data-action="plan" ${attrs} style="color:${planColorFg(p.color)};border:0;background:transparent;cursor:pointer" title="创建今日待办">＋</button>`;
    }

    function displayDate(value) {
      const text = String(value || '');
      if (/^\d{4}-\d{2}-\d{2}$/.test(text)) return text.replace(/-/g, '/');
      if (!text) return '';
      const date = new Date(text);
      return Number.isNaN(date.getTime()) ? text : date.toLocaleDateString('zh-CN');
    }

    function renderCardBasis(m, providerLabel) {
      const trace = m.tool_trace || m.evidence?.tool_trace || [];
      const traceHtml = trace.length ? `<div class="agent-card-trace"><strong>读取内容</strong>${trace.map(item => `<span class="${item.status==='success'?'ok':'error'}">${escapeHTML(displayTool(item))} · ${item.status==='success'?'已完成':'暂不可用'}${item.freshness?` · ${escapeHTML(displayDate(item.freshness))}`:''}</span>`).join('')}</div>` : '';
      return `<details class="agent-card-basis"><summary>查看依据</summary><div class="agent-card-basis-inner"><div class="agent-card-provider">回答来源：${escapeHTML(providerLabel)}</div>${traceHtml}${renderEvidenceBody(m.evidence) || '<p>本次没有读取个人健康数据。</p>'}</div></details>`;
    }

    function renderHealthCard(m, providerLabel) {
      const p = m.presentation;
      const toneLabels = { stable: '状态平稳', watch: '建议留意', warning: '重点关注', urgent: '立即求助', insufficient: '资料不足' };
      const facts = (p.facts || []).slice(0, 3);
      const actionContext = `${p.status?.text || ''} ${(p.facts || []).map(fact => `${fact.label || ''} ${fact.context || ''} ${fact.trend || ''}`).join(' ')}`;
      const actions = (p.actions || []).map(action => normalizeVisiblePlan(action, actionContext)).filter(isValidVisiblePlan).slice(0, 2);
      const factHtml = facts.map(fact => `<article class="agent-fact">
        <span>${escapeHTML(visibleChinese(fact.label || '关键数据'))}</span>
        <strong>${escapeHTML(visibleChinese(fact.value ?? '—'))}<small>${fact.unit ? ` ${escapeHTML(displayUnit(fact.unit))}` : ''}</small></strong>
        ${fact.trend ? `<em>${escapeHTML(visibleChinese(fact.trend))}</em>` : ''}
        ${fact.measured_at ? `<p>记录时间：${escapeHTML(displayDate(fact.measured_at))}</p>` : ''}
        ${fact.context ? `<p>${escapeHTML(visibleChinese(fact.context))}</p>` : ''}
      </article>`).join('');
      const actionHtml = actions.map(action => {
        const normalized = { ...action, title: action.title, desc: action.description, color: p.mode === 'emergency' ? 'red' : 'orange' };
        const controls = action.action_type && action.requires_confirmation ? renderPlanControl(normalized) : '';
        return `<article class="agent-card-action"><div><strong>${escapeHTML(action.title)}</strong><p>${escapeHTML(action.description || '')}</p>${renderActionMetric(normalized)}</div>${controls}</article>`;
      }).join('');
      const urgent = p.mode === 'emergency' || p.status?.tone === 'urgent';
      return `<article class="agent-health-card tone-${escapeHTML(p.status?.tone || 'stable')}" aria-label="${urgent ? '紧急健康提醒' : '健康分析结果'}">
        <header class="agent-card-status"><span>${escapeHTML(toneLabels[p.status?.tone] || '健康提示')}</span><h3>${escapeHTML(visibleChinese(p.status?.title || '当前结论'))}</h3><p>${escapeHTML(visibleChinese(p.status?.text || m.content || ''))}</p></header>
        <section class="agent-card-section" aria-label="关键数据"><h4>关键数据</h4><div class="agent-facts">${factHtml}</div></section>
        <section class="agent-card-section" aria-label="下一步行动"><h4>${urgent ? '立即行动' : '下一步行动'}</h4><div class="agent-card-actions">${actionHtml || '<p class="agent-no-action">当前没有需要确认的复测行动。</p>'}</div></section>
        <aside class="agent-card-safety level-${escapeHTML(p.safety?.level || 'routine')}" ${urgent ? 'role="alert"' : ''}><strong>需要帮助时</strong><p>${escapeHTML(p.safety?.text || '')}</p></aside>
        ${renderCardBasis(m, providerLabel)}
      </article>`;
    }

    function renderClarificationCard(m) {
      const p = m.presentation || {};
      return `<article class="agent-clarification-card"><span>需要您确认</span><h3>${escapeHTML(p.status?.title || '请选择一项')}</h3><p>${escapeHTML(p.status?.text || m.content || '')}</p><div>${(p.choices || []).map(choice => `<button data-clarification-value="${encodeURIComponent(choice.value || choice.label)}">${escapeHTML(choice.label)}</button>`).join('')}</div><small>${escapeHTML(p.safety?.text || '')}</small></article>`;
    }

    function renderMsg(m) {
      const llmMeta = m.llm || {};
      const providerLabel = llmMeta.call_status === 'success'
        ? '健康智能分析'
        : (llmMeta.call_status === 'fallback' ? '本地健康工具结果' : (m.source === 'mock' ? '本地演示结果' : m.source === 'tool' ? '健康工具结果' : '本地健康知识结果'));
      const sourceHtml = m.role === 'assistant' ? `<div style="margin:4px 0 5px;color:#a88970;font-size:11px">回答来源：${escapeHTML(providerLabel)}</div>` : '';
      const hasHealthCard = m.presentation?.mode === 'health_card' || m.presentation?.mode === 'emergency';
      const hasClarification = m.presentation?.mode === 'clarification';
      const visiblePlans = (m.plan || []).map(p => normalizeVisiblePlan(p, m.content || '')).filter(isValidVisiblePlan).slice(0, 1);
      const planHtml = visiblePlans.length ? `
        <div class="msg-plan"><div style="font-size:14px;color:#806B59;margin:4px 0 7px;font-weight:700">今天可以做</div>${visiblePlans.map(p => `
          <div class="plan-card-mini" style="background:${planColorBg(p.color)}">
            <div class="plan-card-icon" style="background:${planColorFg(p.color)};color:#fff">${escapeHTML(p.icon)}</div>
            <div class="plan-card-text">
              <div class="plan-card-t" style="color:${planColorFg(p.color)}">${escapeHTML(p.title || '健康行动')}</div>
              <div class="plan-card-d" style="color:${planColorDesc(p.color)}">${escapeHTML(p.desc || p.description || '')}</div>
              ${renderActionMetric({ ...p, metric_type: inferActionMetric(p) })}
            </div>
            ${renderPlanControl({ ...p, metric_type: inferActionMetric(p) })}
          </div>
        `).join('')}</div>` : '';
      if (m.role === 'assistant') {
        return `
          <div class="msg msg-ai">
            <div class="msg-avatar">康</div>
            <div>
              ${hasHealthCard ? renderHealthCard(m, providerLabel) : hasClarification ? renderClarificationCard(m) : `<div class="msg-bubble">${escapeHTML(visibleChinese(m.content)).replace(/\n/g, '<br/>')}</div>${sourceHtml}${planHtml}${renderToolTrace(m)}${renderEvidence(m.evidence)}`}
              ${renderMemoryCandidates(m)}
              ${renderActions(m)}
            </div>
          </div>`;
      }
      return `
        <div class="msg msg-user"><div class="msg-bubble msg-bubble-user">${escapeHTML(m.content)}</div></div>
      `;
    }

    async function send() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      lastUserMessage = text;
      appendUserMsg(text);
      const typingEl = appendTyping();
      try {
        const r = await API.post('/api/chat', { message: text, subject_user_id: subjectId, conversation_id: conversationId, client_request_id: requestId() });
        conversationId = r.conversation_id || conversationId;
        typingEl.remove();
        document.getElementById('chat-history').insertAdjacentHTML('beforeend',
          renderMsg({
            role: 'assistant',
            content: r.content,
            plan: r.plan,
            confidence: r.confidence || { type: 'common_sense' },
            evidence: r.evidence,
            source: r.source,
            llm: r.llm,
            presentation: r.presentation,
            tool_trace: r.tool_trace,
            memory_candidates: r.memory_candidates,
            id: r.id
          })
        );
        scrollChat();
        if (r.plan && r.plan.length) {
          toast('小康给了你 ' + r.plan.length + ' 条建议', 'success');
        }
      } catch (err) {
        typingEl.remove();
        appendAssistantMsg('我网络不太好，稍后再试？', []);
      }
    }

    function appendUserMsg(text) {
      document.getElementById('chat-history').insertAdjacentHTML('beforeend',
        `<div class="msg msg-user"><div class="msg-bubble msg-bubble-user">${escapeHTML(text)}</div></div>`
      );
      scrollChat();
    }
    function appendAssistantMsg(content, plan) {
      document.getElementById('chat-history').insertAdjacentHTML('beforeend',
        renderMsg({ role: 'assistant', content, plan, confidence: { type: 'common_sense' } })
      );
      scrollChat();
    }
    function appendTyping() {
      const host = document.getElementById('chat-history');
      const el = document.createElement('div');
      el.className = 'msg msg-ai';
      el.innerHTML = `<div class="msg-avatar">康</div><div class="msg-bubble"><span class="loading" style="vertical-align:middle"></span> 小康正在想…</div>`;
      host.appendChild(el);
      scrollChat();
      return el;
    }
    function scrollChat() {
      const el = document.getElementById('chat-history');
      el.scrollTop = el.scrollHeight;
    }

    // ===== 消息操作栏事件绑定（事件委托） =====
    function bindMsgActions() {
      document.getElementById('chat-history').addEventListener('click', (e) => {
        if (e.target.closest('[data-memory-action]')) { handleMemoryAction(e); return; }
        if (e.target.closest('[data-schedule-key]')) { selectScheduleOption(e.target.closest('[data-schedule-key]')); return; }
        const reason = e.target.closest('[data-feedback-reason]');
        if (reason) { submitFeedback(reason.closest('.msg-actions'), 'dislike', reason.dataset.feedbackReason || null); return; }
        const clarify = e.target.closest('[data-clarification-value]');
        if (clarify) { document.getElementById('chat-input').value = decodeURIComponent(clarify.dataset.clarificationValue); send(); return; }
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const action = btn.dataset.action;
        switch (action) {
          case 'copy':       doCopy(btn); break;
          case 'like':       doLike(btn); break;
          case 'dislike':    doDislike(btn); break;
          case 'tts':        doTTS(btn); break;
          case 'regenerate': doRegenerate(btn); break;
          case 'confidence': doConfidence(btn); break;
          case 'plan':       doPlanAction(btn); break;
          case 'dismiss-plan': btn.closest('.plan-card-mini,.agent-card-action,.plan-card')?.remove(); break;
        }
      });
    }

    function bindPlanActions() {
      document.getElementById('plan-list').addEventListener('click', (e) => {
        if (e.target.closest('[data-schedule-key]')) { selectScheduleOption(e.target.closest('[data-schedule-key]')); return; }
        const btn = e.target.closest('[data-action]');
        if (btn?.dataset.action === 'plan') doPlanAction(btn);
        if (btn?.dataset.action === 'dismiss-plan') btn.closest('.plan-card')?.remove();
      });
    }

    function selectScheduleOption(btn) {
      const picker = btn.closest('.agent-schedule-picker');
      picker.querySelectorAll('[data-schedule-key]').forEach(item => item.classList.toggle('selected', item === btn));
      const custom = picker.querySelector('input[type="datetime-local"]');
      custom.hidden = btn.dataset.scheduleKey !== 'custom';
      if (!custom.hidden) custom.focus();
    }

    function selectedDueAt(btn) {
      const scope = btn.closest('.agent-card-action,.plan-card-mini,.plan-card') || btn.parentElement;
      const picker = scope?.querySelector('.agent-schedule-picker');
      const key = picker?.querySelector('[data-schedule-key].selected')?.dataset.scheduleKey || 'tomorrow_morning';
      const due = new Date();
      if (key === 'later_today') due.setTime(due.getTime() + 2 * 3600000);
      else if (key === 'tomorrow_morning') { due.setDate(due.getDate() + 1); due.setHours(8, 0, 0, 0); }
      else {
        const value = picker?.querySelector('input[type="datetime-local"]')?.value;
        if (!value || Number.isNaN(Date.parse(value))) throw new Error('请选择复测日期和时间');
        due.setTime(new Date(value).getTime());
      }
      if (due.getTime() <= Date.now()) throw new Error('复测时间必须晚于现在');
      return { key, due_at: due.toISOString() };
    }

    async function doPlanAction(btn) {
      const title = decodeURIComponent(btn.dataset.title || '完成健康计划');
      const desc = decodeURIComponent(btn.dataset.desc || '');
      const sensitive = /用药|药物|就医|医生|家属|通知/.test(title + desc);
      const actionType = btn.dataset.actionType || (/复测|复查|测量|监测/.test(title) ? 'schedule_recheck' : /通知家属/.test(title) ? 'notify_caregiver' : /联系医生|就医/.test(title) ? 'contact_doctor' : 'create_todo');
      try {
        if (actionType === 'n_of_1_intervention') {
          const payload = JSON.parse(decodeURIComponent(btn.dataset.interventionPayload || ''));
          if (!window.confirm(`请再次核对卡片内容。确认创建并激活“${title}”吗？这不是药物调整，也不能替代就医。`)) return;
          const created = await API.post('/api/actions/interventions', { ...payload, subject_user_id: subjectId });
          if (!created.intervention?.intervention_id) throw new Error('没有生成待确认干预');
          await API.post(`/api/actions/interventions/${created.intervention.intervention_id}/confirm`, {});
          btn.textContent = '已确认'; btn.disabled = true; toast('干预已由本人确认并激活', 'success'); await loadInbox(); return;
        }
        if (actionType === 'record_adherence') {
          const payload = JSON.parse(decodeURIComponent(btn.dataset.adherencePayload || ''));
          if (!window.confirm(`确认写入“${title}”吗？`)) return;
          await API.post(`/api/actions/interventions/${btn.dataset.interventionId}/executions`, payload);
          btn.textContent = '已记录'; btn.disabled = true; toast('执行情况已记录', 'success'); await loadInbox(); return;
        }
        const schedule = actionType === 'schedule_recheck' ? selectedDueAt(btn) : {};
        const metricType = btn.dataset.metricType || (/血压/.test(title + desc) ? 'bp' : /血糖/.test(title + desc) ? 'glucose' : /心率|脉搏/.test(title + desc) ? 'hr' : /体重/.test(title + desc) ? 'weight' : /睡眠/.test(title + desc) ? 'sleep' : null);
        if (actionType === 'schedule_recheck' && !metricType) throw new Error('请先明确要复测的健康指标');
        const r = await API.post('/api/actions', { action_type: actionType, title, desc, kind: sensitive ? 'sensitive' : 'agent', subject_user_id: subjectId,
          metric_type: metricType, baseline_metric_id: btn.dataset.baselineMetricId ? Number(btn.dataset.baselineMetricId) : null, ...schedule, idempotency_key: requestId() });
        if (!r.requires_confirmation || !r.request?.id) throw new Error('服务端没有返回待确认行动');
        if (!window.confirm(`待确认预览已生成。确认写入“${title}”吗？系统只会创建站内记录，不会自动打电话或发短信。`)) {
          await API.post(`/api/actions/${r.request.id}/cancel`, {});
          toast('已取消，没有创建待办或通知', 'success');
          return;
        }
        await API.post(`/api/actions/${r.request.id}/confirm`, {});
        btn.textContent = '✓';
        btn.disabled = true;
        toast('已确认并记录行动', 'success');
        await loadInbox();
      } catch (err) { toast(err.message, 'error'); }
    }

    function doCopy(btn) {
      const text = decodeURIComponent(btn.dataset.content || '');
      navigator.clipboard.writeText(text).then(() => {
        btn.classList.add('copied');
        const orig = btn.innerHTML;
        btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> 已复制`;
        setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = orig; }, 2000);
      }).catch(() => {
        // fallback
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); toast('已复制', 'success'); } catch {}
        document.body.removeChild(ta);
      });
    }

    async function submitFeedback(parent, rating, reason = null) {
      const id = Number(parent?.dataset.msgId);
      if (!id) { toast('这条旧消息暂不支持反馈', 'error'); return; }
      await API.put(`/api/agent/messages/${id}/feedback`, { rating, reason });
      parent.querySelector('[data-action="like"]')?.classList.toggle('active', rating === 'like');
      parent.querySelector('[data-action="like"]')?.classList.toggle('like', rating === 'like');
      parent.querySelector('[data-action="dislike"]')?.classList.toggle('active', rating === 'dislike');
      parent.querySelector('.agent-feedback-reasons')?.remove();
      toast('感谢反馈，已记录', 'success');
    }

    async function doLike(btn) {
      const parent = btn.closest('.msg-actions');
      const isOn = btn.classList.contains('active');
      try {
        if (isOn) { await API.delete(`/api/agent/messages/${parent.dataset.msgId}/feedback`); btn.classList.remove('active','like'); toast('已取消反馈', 'success'); }
        else await submitFeedback(parent, 'like');
      } catch (error) { toast(error.message, 'error'); }
    }

    function doDislike(btn) {
      const parent = btn.closest('.msg-actions');
      const isOn = btn.classList.contains('active');
      if (isOn) {
        API.delete(`/api/agent/messages/${parent.dataset.msgId}/feedback`).then(() => { btn.classList.remove('active'); toast('已取消反馈', 'success'); }).catch(error => toast(error.message, 'error'));
        return;
      }
      parent.querySelector('.agent-feedback-reasons')?.remove();
      parent.insertAdjacentHTML('beforeend', `<div class="agent-feedback-reasons"><strong>哪里需要改进？</strong>${['没看懂','数据不对','建议没用','没有回答问题'].map(reason => `<button data-feedback-reason="${reason}">${reason}</button>`).join('')}<button data-feedback-reason="">跳过原因</button></div>`);
    }

    function doTTS(btn) {
      // 如果正在朗读，停止
      if (ttsUtterance) {
        window.speechSynthesis.cancel();
        document.querySelectorAll('.msg-action-btn.reading').forEach(b => {
          b.classList.remove('reading');
          const origText = b.querySelector('svg + *') || b.lastChild;
          if (origText) origText.textContent = ' 朗读';
        });
        ttsUtterance = null;
        if (btn.classList.contains('reading')) return;
      }

      const text = decodeURIComponent(btn.dataset.content || '');
      if (!text || !window.speechSynthesis) {
        toast('浏览器不支持语音朗读', 'error');
        return;
      }

      ttsUtterance = new SpeechSynthesisUtterance(text);
      ttsUtterance.lang = 'zh-CN';
      ttsUtterance.rate = 0.9;
      ttsUtterance.pitch = 1.0;

      btn.classList.add('reading');
      const label = btn.lastChild;
      if (label) label.textContent = ' 朗读中';

      ttsUtterance.onend = () => {
        btn.classList.remove('reading');
        if (label) label.textContent = ' 朗读';
        ttsUtterance = null;
      };
      ttsUtterance.onerror = () => {
        btn.classList.remove('reading');
        if (label) label.textContent = ' 朗读';
        ttsUtterance = null;
      };

      window.speechSynthesis.speak(ttsUtterance);
    }

    async function doRegenerate(btn) {
      const messageId = Number(btn.dataset.msgId);
      if (!messageId) { toast('这条旧消息暂不支持重新生成', 'error'); return; }
      // 找到当前消息的 .msg-ai 容器并替换内容
      const msgEl = btn.closest('.msg-ai');
      if (!msgEl) return;

      // 替换为加载状态
      const contentDiv = msgEl.querySelector('.msg-bubble') || msgEl.querySelector('.agent-card-status p');
      if (!contentDiv) { toast('这条消息暂不支持重新生成', 'error'); return; }
      const oldContent = contentDiv.innerHTML;
      contentDiv.innerHTML = `<span class="loading" style="vertical-align:middle"></span> 小康正在重新想…`;

      try {
        const r = await API.post(`/api/chat/messages/${messageId}/regenerate`, { client_request_id: requestId() });
        // 重新渲染整条消息
        const newHtml = renderMsg({
          role: 'assistant',
          content: r.content,
          plan: r.plan,
          confidence: r.confidence || { type: 'common_sense' },
          evidence: r.evidence,
          presentation: r.presentation,
          source: r.source,
          llm: r.llm,
          tool_trace: r.tool_trace,
          memory_candidates: r.memory_candidates,
          id: r.id
        });
        msgEl.outerHTML = newHtml;
        scrollChat();
        toast('已重新生成', 'success');
      } catch (err) {
        contentDiv.innerHTML = oldContent;
        toast('重新生成失败', 'error');
      }
    }

    function doConfidence(btn) {
      const score = parseInt(btn.dataset.score, 10) || 0;
      const sources = JSON.parse(btn.dataset.sources || '[]');
      const reasoning = btn.dataset.reasoning || '';
      const params = new URLSearchParams({ score, sources: JSON.stringify(sources), reasoning });
      window.open(`confidence.html?${params.toString()}`, '_blank');
    }

    async function loadPlan() {
      try {
        const messages = await API.get(`/api/chat/history?${agentQuery()}`);
        let plan = [];
        for (const message of [...messages].reverse()) {
          if (message.role !== 'assistant' || !message.plan?.length) continue;
          const usable = message.plan.map(item => normalizeVisiblePlan(item, message.content || '')).filter(isValidVisiblePlan);
          if (usable.length) { plan = usable; break; }
        }
        document.getElementById('plan-count').textContent = `${plan.length} 项`;
        document.getElementById('plan-today').textContent = new Date().toISOString().slice(0, 10);
        document.getElementById('plan-list').innerHTML = plan.map(p => `
          <div class="plan-card" style="background:${planColorBg(p.color)}">
            <div class="plan-card-icon" style="background:${planColorFg(p.color)};color:#fff">${escapeHTML(p.icon)}</div>
            <div class="plan-card-text">
              <div class="plan-card-t" style="color:${planColorFg(p.color)}">${escapeHTML(p.title)}</div>
              <div class="plan-card-d" style="color:${planColorDesc(p.color)}">${escapeHTML(p.desc || '')}</div>
              ${renderActionMetric({ ...p, metric_type: inferActionMetric(p) })}
            </div>
              ${renderPlanControl({ ...p, metric_type: inferActionMetric(p) })}
          </div>
        `).join('') || '<div class="empty">暂无方案，先在左边和小康聊聊</div>';
      } catch (err) {
        document.getElementById('plan-list').innerHTML = '<div class="empty">加载失败</div>';
      }
    }

    async function loadDailyTip() {
      if (!subjectId) return;
      const host = document.getElementById('daily-tip-content');
      const badge = document.getElementById('daily-tip-status');
      try {
        const data = await API.get(`/api/agent/daily-tip?subject_user_id=${subjectId}`);
        if (!data.tip) {
          badge.textContent = '暂无内容';
          badge.className = 'empty';
          host.innerHTML = '<p>今天暂无可展示的健康贴士。</p>';
          return;
        }
        const tip = data.tip;
        badge.textContent = tip.status_label;
        badge.className = tip.display_status === 'approved' ? 'approved' : 'preview';
        host.innerHTML = `<h3>${escapeHTML(tip.title)}</h3><p>${escapeHTML(tip.text)}</p>
          ${tip.why_for_you ? `<p class="agent-tip-why">为什么适合您：${escapeHTML(tip.why_for_you)}</p>` : ''}
          <small>${escapeHTML(tip.safety_text)}</small>
          <a href="${escapeHTML(tip.source_url)}">查看来源：${escapeHTML(tip.source_label)}</a>`;
      } catch (error) {
        badge.textContent = '暂不可用';
        badge.className = 'empty';
        host.innerHTML = '<p>贴士暂时无法读取，请稍后再试。</p>';
      }
    }

    function renderQuickPrompts() {
      const host = document.getElementById('quick-prompts');
      host.innerHTML = PROMPTS.map(p => `<button class="prompt" data-prompt>${escapeHTML(p)}</button>`).join('');
      bindPrompts(host);
    }

    function planColorFg(c) {
      return { orange:'#F4A261', green:'#7FB069', purple:'#9C7BC9', red:'#E0784E', gray:'#9C8B7A' }[c] || '#F4A261';
    }
    function planColorBg(c) {
      return { orange:'#FFE9D9', green:'#E5F0DC', purple:'#F1E8F5', red:'#FBE4DD', gray:'#FAF6EF' }[c] || '#FFE9D9';
    }
    function planColorDesc(c) {
      return { orange:'#A45F3D', green:'#5A8045', purple:'#8A6DAE', red:'#8A4538', gray:'#6B5A4A' }[c] || '#A45F3D';
    }
    function escapeHTML(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]); }
  </script>
</body>
