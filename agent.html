<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能管家 · 小康·健康管家</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div id="app-nav"></div>

  <main class="main">
    <header class="page-head" style="display:flex;justify-content:space-between;align-items:flex-end">
      <div>
        <h1>智能管家</h1>
        <p class="subtitle">和小康聊聊 · 给你定制今日方案</p>
      </div>
      <div class="tabs" data-tabs id="mode-tabs" style="margin:0">
        <button class="tab active" data-tab="plan" style="padding:8px 18px;border:none;background:#F4A261;color:#fff;border-radius:18px;font-weight:700;font-family:var(--font-cn);cursor:pointer">方案</button>
        <button class="tab" data-tab="qa" style="padding:8px 18px;border:none;background:transparent;color:#9C8B7A;border-radius:18px;font-weight:500;font-family:var(--font-cn);cursor:pointer">问答</button>
        <button class="tab" data-tab="tip" style="padding:8px 18px;border:none;background:transparent;color:#9C8B7A;border-radius:18px;font-weight:500;font-family:var(--font-cn);cursor:pointer">贴士</button>
      </div>
    </header>

    <section class="agent-row">
      <div class="chat-area">
        <div class="chat-history" id="chat-history"></div>
        <div class="quick-prompts" id="quick-prompts"></div>
        <div class="chat-input-bar">
          <input class="input chat-input" id="chat-input" placeholder="你想问点什么…" />
          <button class="btn-icon" id="btn-send" style="background:var(--c-primary);color:#fff;border:none">→</button>
        </div>
      </div>

      <div class="plan-area">
        <div class="plan-header">
          <span class="plan-title">今日方案</span>
          <span class="plan-badge" id="plan-count">— 项</span>
        </div>
        <div class="plan-sub">AI 实时生成 · <span id="plan-today">—</span></div>
        <div id="plan-list"></div>
      </div>
    </section>
  </main>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener('auth:ready', () => {
      bindTabs();
      loadChat();
      loadPlan();
      bindSend();
      bindPrompts();
      bindMsgActions();
      bindPlanActions();
      renderQuickPrompts('plan');
    });
    Auth.init();

    const PROMPTS = {
      plan: ['为什么血压偏高？', '推荐适合我的运动', '一日三餐怎么吃？', '我今晚该注意什么？'],
      qa: ['什么是窦性心律？', '血压多少算正常？', '糖尿病能吃水果吗？', '失眠怎么办？'],
      tip: ['今日养生贴士', '冬季注意事项', '饭后不宜做的 3 件事', '喝水也有讲究？'],
    };

    let activeTab = 'plan';
    let lastUserMessage = '';
    let ttsUtterance = null;

    function bindSend() {
      document.getElementById('btn-send').addEventListener('click', send);
      document.getElementById('chat-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') send();
      });
    }

    async function loadChat() {
      const hist = document.getElementById('chat-history');
      try {
        const msgs = await API.get('/api/chat/history');
        if (!msgs.length) {
          hist.innerHTML = renderMsg({
            role: 'assistant',
            content: '您好，我是小康，您的健康管家。想了解今天的身体状况吗？',
            plan: null,
            confidence: { type: 'common_sense' }
          });
          return;
        }
        hist.innerHTML = msgs.map(renderMsg).join('');
        scrollChat();
      } catch (err) {
        hist.innerHTML = `<div class="empty">对话读取失败：${escapeHTML(err.message)}</div>`;
      }
    }

    function confidenceScoreClass(score) {
      if (score >= 80) return 'score-high';
      if (score >= 60) return 'score-mid';
      return 'score-low';
    }

    function renderActions(m) {
      if (m.role !== 'assistant') return '';
      const conf = m.confidence || { type: 'common_sense' };
      const isData = conf.type === 'data' && conf.score != null;
      const msgId = m.id || ('msg-' + Math.random().toString(36).slice(2, 9));
      const contentEscaped = encodeURIComponent(m.content || '');

      let confidenceHtml = '';
      if (isData) {
        const cls = confidenceScoreClass(conf.score);
        confidenceHtml = `
          <button class="msg-action-btn confidence-btn ${cls}" data-action="confidence" data-msg-id="${msgId}"
                  data-score="${conf.score}" data-sources='${JSON.stringify(conf.sources || []).replace(/'/g, "&#39;")}'
                  data-reasoning="${escapeHTML(conf.reasoning || '')}"
                  title="查看可信度评分细则">
            <span class="score-ring">${conf.score}</span>
            可信度
          </button>`;
      } else {
        confidenceHtml = `
          <span class="common-sense-tag">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 16v-4M12 8h.01"/>
            </svg>
            常识
          </span>`;
      }

      return `
        <div class="msg-actions" data-msg-id="${msgId}">
          <button class="msg-action-btn" data-action="copy" data-content="${contentEscaped}" title="复制">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            复制
          </button>
          <button class="msg-action-btn" data-action="like" title="赞">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>
            </svg>
            赞
          </button>
          <button class="msg-action-btn" data-action="dislike" title="踩">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/>
            </svg>
            踩
          </button>
          <span class="msg-action-sep"></span>
          <button class="msg-action-btn" data-action="tts" data-content="${contentEscaped}" title="朗读">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
            </svg>
            朗读
          </button>
          <button class="msg-action-btn" data-action="regenerate" data-msg-id="${msgId}" title="重新生成">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"/>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
            重新生成
          </button>
          ${confidenceHtml}
        </div>`;
    }

    function renderEvidence(evidence) {
      if (!evidence || !Array.isArray(evidence.items) || !evidence.items.length) return '';
      const trendName = { rising: '上升', falling: '下降', stable: '基本稳定', unknown: '暂不判断' };
      const rows = evidence.items.slice(0, 4).map(item => {
        const value = item.latest_value == null ? '—' : `${item.latest_value}${item.unit ? ' ' + item.unit : ''}`;
        const date = item.measured_at ? new Date(item.measured_at).toLocaleDateString('zh-CN') : '—';
        return `<div style="display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #f2e9df">
          <span style="color:#6f6257">${escapeHTML(item.metric)} · ${escapeHTML(date)}</span>
          <span style="color:#3d2e1f;font-weight:600">${escapeHTML(value)} · ${escapeHTML(trendName[item.trend] || '暂不判断')}</span>
        </div>`;
      }).join('');
      return `<div class="agent-evidence" style="margin-top:10px;padding:10px 12px;background:#fffaf4;border:1px solid #f0dfce;border-radius:12px;font-size:12px">
        <div style="font-weight:700;color:#9a6a42;margin-bottom:3px">依据 · 后端真实健康数据</div>
        <div style="color:#9c8b7a;margin-bottom:4px">近${Number(evidence.period_days || 90)}天，共 ${Number(evidence.data_points || 0)} 条记录</div>
        ${rows}
        ${evidence.missing_metrics && evidence.missing_metrics.length ? `<div style="color:#a87952;margin-top:6px">缺少：${escapeHTML(evidence.missing_metrics.join('、'))}</div>` : ''}
      </div>`;
    }

    function renderMsg(m) {
      const planHtml = m.plan && m.plan.length ? `
        <div class="msg-plan">${m.plan.map(p => `
          <div class="plan-card-mini" style="background:${planColorBg(p.color)}">
            <div class="plan-card-icon" style="background:${planColorFg(p.color)};color:#fff">${escapeHTML(p.icon)}</div>
            <div class="plan-card-text">
              <div class="plan-card-t" style="color:${planColorFg(p.color)}">${escapeHTML(p.title)}</div>
              <div class="plan-card-d" style="color:${planColorDesc(p.color)}">${escapeHTML(p.desc || '')}</div>
            </div>
            <button class="plan-card-check" data-action="plan" data-action-type="${p.action_type || ''}" data-title="${encodeURIComponent(p.title)}" data-desc="${encodeURIComponent(p.desc || '')}" style="color:${planColorFg(p.color)};border:0;background:transparent;cursor:pointer" title="创建今日待办">＋</button>
          </div>
        `).join('')}</div>` : '';
      if (m.role === 'assistant') {
        return `
          <div class="msg msg-ai">
            <div class="msg-avatar">康</div>
            <div>
              <div class="msg-bubble">${escapeHTML(m.content).replace(/\n/g, '<br/>')}</div>
              ${planHtml}
              ${renderEvidence(m.evidence)}
              ${renderActions(m)}
            </div>
          </div>`;
      }
      return `
        <div class="msg msg-user"><div class="msg-bubble msg-bubble-user">${escapeHTML(m.content)}</div></div>
      `;
    }

    async function send() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      lastUserMessage = text;
      appendUserMsg(text);
      const typingEl = appendTyping();
      try {
        const r = await API.post('/api/chat', { message: text });
        typingEl.remove();
        document.getElementById('chat-history').insertAdjacentHTML('beforeend',
          renderMsg({
            role: 'assistant',
            content: r.content,
            plan: r.plan,
            confidence: r.confidence || { type: 'common_sense' },
            evidence: r.evidence,
            id: r.id
          })
        );
        scrollChat();
        if (r.plan && r.plan.length) {
          toast('小康给了你 ' + r.plan.length + ' 条建议', 'success');
        }
      } catch (err) {
        typingEl.remove();
        appendAssistantMsg('我网络不太好，稍后再试？', []);
      }
    }

    function appendUserMsg(text) {
      document.getElementById('chat-history').insertAdjacentHTML('beforeend',
        `<div class="msg msg-user"><div class="msg-bubble msg-bubble-user">${escapeHTML(text)}</div></div>`
      );
      scrollChat();
    }
    function appendAssistantMsg(content, plan) {
      document.getElementById('chat-history').insertAdjacentHTML('beforeend',
        renderMsg({ role: 'assistant', content, plan, confidence: { type: 'common_sense' } })
      );
      scrollChat();
    }
    function appendTyping() {
      const host = document.getElementById('chat-history');
      const el = document.createElement('div');
      el.className = 'msg msg-ai';
      el.innerHTML = `<div class="msg-avatar">康</div><div class="msg-bubble"><span class="loading" style="vertical-align:middle"></span> 小康正在想…</div>`;
      host.appendChild(el);
      scrollChat();
      return el;
    }
    function scrollChat() {
      const el = document.getElementById('chat-history');
      el.scrollTop = el.scrollHeight;
    }

    // ===== 消息操作栏事件绑定（事件委托） =====
    function bindMsgActions() {
      document.getElementById('chat-history').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const action = btn.dataset.action;
        switch (action) {
          case 'copy':       doCopy(btn); break;
          case 'like':       doLike(btn); break;
          case 'dislike':    doDislike(btn); break;
          case 'tts':        doTTS(btn); break;
          case 'regenerate': doRegenerate(btn); break;
          case 'confidence': doConfidence(btn); break;
          case 'plan':       doPlanAction(btn); break;
        }
      });
    }

    function bindPlanActions() {
      document.getElementById('plan-list').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-action="plan"]');
        if (btn) doPlanAction(btn);
      });
    }

    async function doPlanAction(btn) {
      const title = decodeURIComponent(btn.dataset.title || '完成健康计划');
      const desc = decodeURIComponent(btn.dataset.desc || '');
      const sensitive = /用药|药物|就医|医生|家属|通知/.test(title + desc);
      if (sensitive && !window.confirm(`这项建议涉及${/用药|药物/.test(title + desc) ? '用药' : '就医/联系他人'}，确认要创建待办吗？`)) return;
      const actionType = btn.dataset.actionType || (/复测|复查|测量|监测/.test(title) ? 'schedule_recheck' : /通知家属/.test(title) ? 'notify_caregiver' : /联系医生|就医/.test(title) ? 'contact_doctor' : 'create_todo');
      try {
        // 敏感行动先以 pending_confirmation 写入服务端，确认后再执行；不能只依赖浏览器端的 confirm。
        const r = await API.post('/api/actions', { action_type: actionType, title, desc, kind: sensitive ? 'sensitive' : 'agent', confirmed: !sensitive });
        if (sensitive && r.requires_confirmation && r.request?.id) {
          await API.post(`/api/actions/${r.request.id}/confirm`, {});
        }
        btn.textContent = '✓';
        btn.disabled = true;
        toast(sensitive ? '已确认并记录行动' : '已创建今日待办', 'success');
      } catch (err) { toast(err.message, 'error'); }
    }

    function doCopy(btn) {
      const text = decodeURIComponent(btn.dataset.content || '');
      navigator.clipboard.writeText(text).then(() => {
        btn.classList.add('copied');
        const orig = btn.innerHTML;
        btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> 已复制`;
        setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = orig; }, 2000);
      }).catch(() => {
        // fallback
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); toast('已复制', 'success'); } catch {}
        document.body.removeChild(ta);
      });
    }

    function doLike(btn) {
      const parent = btn.closest('.msg-actions');
      const dislikeBtn = parent?.querySelector('[data-action="dislike"]');
      const isOn = btn.classList.contains('active');
      btn.classList.toggle('active');
      btn.classList.toggle('like', !isOn);
      if (!isOn && dislikeBtn?.classList.contains('active')) {
        dislikeBtn.classList.remove('active');
      }
      if (!isOn) toast('感谢反馈', 'success');
    }

    function doDislike(btn) {
      const parent = btn.closest('.msg-actions');
      const likeBtn = parent?.querySelector('[data-action="like"]');
      const isOn = btn.classList.contains('active');
      btn.classList.toggle('active');
      if (!isOn && likeBtn?.classList.contains('active')) {
        likeBtn.classList.remove('active');
        likeBtn.classList.remove('like');
      }
      if (!isOn) toast('已记录你的反馈', 'info');
    }

    function doTTS(btn) {
      // 如果正在朗读，停止
      if (ttsUtterance) {
        window.speechSynthesis.cancel();
        document.querySelectorAll('.msg-action-btn.reading').forEach(b => {
          b.classList.remove('reading');
          const origText = b.querySelector('svg + *') || b.lastChild;
          if (origText) origText.textContent = ' 朗读';
        });
        ttsUtterance = null;
        if (btn.classList.contains('reading')) return;
      }

      const text = decodeURIComponent(btn.dataset.content || '');
      if (!text || !window.speechSynthesis) {
        toast('浏览器不支持语音朗读', 'error');
        return;
      }

      ttsUtterance = new SpeechSynthesisUtterance(text);
      ttsUtterance.lang = 'zh-CN';
      ttsUtterance.rate = 0.9;
      ttsUtterance.pitch = 1.0;

      btn.classList.add('reading');
      const label = btn.lastChild;
      if (label) label.textContent = ' 朗读中';

      ttsUtterance.onend = () => {
        btn.classList.remove('reading');
        if (label) label.textContent = ' 朗读';
        ttsUtterance = null;
      };
      ttsUtterance.onerror = () => {
        btn.classList.remove('reading');
        if (label) label.textContent = ' 朗读';
        ttsUtterance = null;
      };

      window.speechSynthesis.speak(ttsUtterance);
    }

    async function doRegenerate(btn) {
      if (!lastUserMessage) {
        toast('没有可重新生成的消息', 'error');
        return;
      }
      // 找到当前消息的 .msg-ai 容器并替换内容
      const msgEl = btn.closest('.msg-ai');
      if (!msgEl) return;

      // 替换为加载状态
      const contentDiv = msgEl.querySelector('.msg-bubble');
      const oldContent = contentDiv.innerHTML;
      contentDiv.innerHTML = `<span class="loading" style="vertical-align:middle"></span> 小康正在重新想…`;

      try {
        const r = await API.post('/api/chat', { message: lastUserMessage });
        // 重新渲染整条消息
        const newHtml = renderMsg({
          role: 'assistant',
          content: r.content,
          plan: r.plan,
          confidence: r.confidence || { type: 'common_sense' },
          id: r.id
        });
        msgEl.outerHTML = newHtml;
        scrollChat();
        toast('已重新生成', 'success');
      } catch (err) {
        contentDiv.innerHTML = oldContent;
        toast('重新生成失败', 'error');
      }
    }

    function doConfidence(btn) {
      const score = parseInt(btn.dataset.score, 10) || 0;
      const sources = JSON.parse(btn.dataset.sources || '[]');
      const reasoning = btn.dataset.reasoning || '';
      const params = new URLSearchParams({ score, sources: JSON.stringify(sources), reasoning });
      window.open(`confidence.html?${params.toString()}`, '_blank');
    }

    async function loadPlan() {
      try {
        const r = await API.post('/api/chat', { message: '今天我该怎么调' });
        const plan = r.plan || [];
        document.getElementById('plan-count').textContent = `${plan.length} 项`;
        document.getElementById('plan-today').textContent = new Date().toISOString().slice(0, 10);
        document.getElementById('plan-list').innerHTML = plan.map(p => `
          <div class="plan-card" style="background:${planColorBg(p.color)}">
            <div class="plan-card-icon" style="background:${planColorFg(p.color)};color:#fff">${escapeHTML(p.icon)}</div>
            <div class="plan-card-text">
              <div class="plan-card-t" style="color:${planColorFg(p.color)}">${escapeHTML(p.title)}</div>
              <div class="plan-card-d" style="color:${planColorDesc(p.color)}">${escapeHTML(p.desc || '')}</div>
            </div>
              <button class="plan-card-check" data-action="plan" data-action-type="${p.action_type || ''}" data-title="${encodeURIComponent(p.title)}" data-desc="${encodeURIComponent(p.desc || '')}" style="color:${planColorFg(p.color)};border:0;background:transparent;cursor:pointer" title="创建今日待办">＋</button>
          </div>
        `).join('') || '<div class="empty">暂无方案，先在左边和小康聊聊</div>';
      } catch (err) {
        document.getElementById('plan-list').innerHTML = '<div class="empty">加载失败</div>';
      }
    }

    function renderQuickPrompts(mode) {
      activeTab = mode;
      const host = document.getElementById('quick-prompts');
      host.innerHTML = (PROMPTS[mode] || []).map(p => `<button class="prompt" data-prompt>${escapeHTML(p)}</button>`).join('');
      bindPrompts(host);
    }

    // Tab 切换
    document.getElementById('mode-tabs').addEventListener('click', (e) => {
      const tab = e.target.closest('.tab');
      if (!tab) return;
      e.preventDefault();
      const target = tab.dataset.tab;
      if (activeTab === target) return;
      activeTab = target;
      renderQuickPrompts(target);
      const tips = {
        qa: '切换到问答模式，问我任何健康相关的问题。',
        tip: '切换到贴士模式，我会给你一些日常建议。',
        plan: '切换到方案模式，我可以给出今日的方案。',
      };
      appendAssistantMsg(tips[target] || '', []);
    });

    function planColorFg(c) {
      return { orange:'#F4A261', green:'#7FB069', purple:'#9C7BC9', red:'#E0784E', gray:'#9C8B7A' }[c] || '#F4A261';
    }
    function planColorBg(c) {
      return { orange:'#FFE9D9', green:'#E5F0DC', purple:'#F1E8F5', red:'#FBE4DD', gray:'#FAF6EF' }[c] || '#FFE9D9';
    }
    function planColorDesc(c) {
      return { orange:'#A45F3D', green:'#5A8045', purple:'#8A6DAE', red:'#8A4538', gray:'#6B5A4A' }[c] || '#A45F3D';
    }
    function escapeHTML(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]); }
  </script>
</body>
</html>
