name: Test and build

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.23.2]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install Node dependencies
        working-directory: server
        run: npm ci

      - name: Install Python runtime and test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Node unit tests
        working-directory: server
        run: npm run test:unit

      - name: Node integration tests with copied database
        working-directory: server
        run: npm run test:integration

      - name: Python unit tests
        run: python scripts/run_python_tests.py unit

      - name: GraphRAG build and safety regression
        working-directory: server
        run: npm run test:graphrag

      - name: Curve leakage regression
        working-directory: server
        run: npm run test:curve

      - name: Security regression
        working-directory: server
        run: npm run test:security

      - name: Syntax and UTF-8 checks
        working-directory: server
        run: npm run test:syntax

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and inspect local image
        run: |
          docker build -t evicare-security-check .
          docker run --rm --entrypoint sh evicare-security-check -c 'found="$(find /app -type f \( -name ".env" -o -name "*.db" -o -name "*.sqlite" -o -name "*.sqlite3" -o -name "*.pyc" \) -print -quit)"; test -z "$found"'

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/mtgdbh/elderly-health:latest
            ghcr.io/mtgdbh/elderly-health:${{ github.sha }}
