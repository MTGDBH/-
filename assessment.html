<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>健康评估 · 小康·健康管家</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div id="app-nav"></div>

  <main class="main">
    <header class="page-head">
      <h1>健康评估</h1>
      <p class="subtitle">AI 综合评估你的健康状况</p>
    </header>

    <section class="assess-row">
      <div class="total-card">
        <div class="total-header">
          <span class="total-title">总健康评分</span>
          <span class="total-badge" id="total-badge">—</span>
        </div>

        <div class="ring-row">
          <div class="ring-svg" id="ring-container">
            <svg width="240" height="240" viewBox="0 0 240 240">
              <circle cx="120" cy="120" r="100" stroke="#FAF0E1" stroke-width="20" fill="none"/>
              <circle id="ring-progress" cx="120" cy="120" r="100" stroke="#F4A261" stroke-width="20" fill="none" stroke-linecap="round" transform="rotate(-90 120 120)" pathLength="628"/>
              <text id="ring-num" x="120" y="135" text-anchor="middle" font-size="64" font-weight="700" fill="#F4A261" font-family="sans-serif">--</text>
              <text x="120" y="165" text-anchor="middle" font-size="14" font-weight="500" fill="#9C8B7A" font-family="sans-serif">/ 100 分</text>
            </svg>
          </div>
          <div class="ring-side">
            <div class="ring-side-label">AI 综合评分</div>
            <div class="ring-side-desc" id="summary-text">—</div>
            <div class="ring-side-comp" id="ring-meta">—</div>
          </div>
        </div>

        <div class="divider"></div>

        <div class="sub-title">分项评分</div>
        <div class="sub-list" id="sub-list"></div>

        <div class="assess-footer">
          <a class="score-link" href="metric.html?type=bp">查看血压趋势 →</a>
          <span class="score-footer-tip" id="evaluated-at">—</span>
        </div>
      </div>

      <div class="assess-right">
        <div class="life-card">
          <div class="life-title">生活能力评估</div>
          <div class="life-sub" id="life-sub">—</div>
          <div class="life-row"><div class="life-icon" style="background:#E5F0DC;color:#5A8045">日</div><div class="life-text"><div class="life-name">基本生活 ADL</div><div class="life-desc">吃饭、穿衣、移动、如厕</div></div><div class="life-score" style="color:#5A8045" id="adl">--</div></div>
          <div class="life-row"><div class="life-icon" style="background:#FFE9D9;color:#F4A261">用</div><div class="life-text"><div class="life-name">工具性生活 IADL</div><div class="life-desc">做饭、购物、用药、电话</div></div><div class="life-score" style="color:#F4A261" id="iadl">--</div></div>
          <button class="btn btn-primary btn-block" id="btn-assess">开始重新评估</button>
        </div>

        <div class="improve-card">
          <div class="improve-title">改善建议</div>
          <div class="improve-sub">AI 基于你的数据定制 · 最多 3 条</div>
          <div id="suggest-list"></div>
        </div>
      </div>
    </section>

    <section class="disease-risk-panel" aria-labelledby="disease-risk-title">
      <div class="disease-risk-head">
        <div>
          <div class="disease-risk-title" id="disease-risk-title">健康预测与疾病发现</div>
          <div class="disease-risk-sub">曲线、四类疾病筛查、资料完整度和下一步行动已集中到健康发现中心</div>
        </div>
        <span class="risk-horizon-badge">统一结果</span>
      </div>
      <div class="disease-risk-cta" style="display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px;border-radius:14px;background:#FFF8F0;flex-wrap:wrap">
        <div style="font-size:16px;line-height:1.7;color:#625449">疾病概率只有通过严格验证门槛时才会显示；突发症状和异常测量会优先提示。</div>
        <a class="btn btn-primary" href="prediction.html">查看完整健康发现 →</a>
      </div>
      <div class="disease-risk-foot">这里不再重复计算，避免不同页面出现不一致结论。</div>
    </section>
  </main>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener('auth:ready', () => loadAll());
    Auth.init();

    async function loadAll() {
      try {
        const d = await API.get('/api/assessments/latest');
        renderTotal(d);
        renderSubs(d.subscores);
        renderAdlIadl(d);
        renderSuggest(d.suggestions);
        document.getElementById('evaluated-at').textContent = '最近评估：' + (d.evaluated_at || '').slice(0, 16).replace('T', ' ');
      } catch (err) {
        document.getElementById('summary-text').textContent = '加载失败：' + err.message;
      }
    }

    const diseaseRiskMeta = [
      { key: 'hypertension', name: '高血压', icon: '压', tone: 'orange', desc: '关注血压变化' },
      { key: 'diabetes', name: '糖尿病', icon: '糖', tone: 'purple', desc: '关注血糖记录' },
      { key: 'heart_disease', name: '心脏病', icon: '心', tone: 'green', desc: '关注心血管状态' },
      { key: 'stroke', name: '脑卒中', icon: '脑', tone: 'red', desc: '关注综合风险因素' },
    ];

    async function loadDiseaseRisks() {
      const host = document.getElementById('disease-risk-grid');
      const results = await Promise.all(diseaseRiskMeta.map(async meta => {
        try { return { meta, data: await API.get('/api/prediction/disease/' + meta.key) }; }
        catch (error) { return { meta, data: { success: false, error: error.message || '暂时无法获取' } }; }
      }));
      host.innerHTML = results.map(({ meta, data }) => renderDiseaseRisk(meta, data)).join('');
    }

    function renderDiseaseRisk(meta, data) {
      if (!data || data.error === 'no_data') {
        return `<article class="disease-risk-card ${meta.tone}">
          <div class="risk-card-top"><span class="risk-icon">${meta.icon}</span><div><div class="risk-name">${meta.name}</div><div class="risk-desc">${meta.desc}</div></div><span class="risk-state muted">待记录</span></div>
          <div class="risk-empty">还没有足够的监测数据<br><a href="monitoring.html">去记录数据 →</a></div>
        </article>`;
      }
      if (!data.success) {
        return `<article class="disease-risk-card ${meta.tone}"><div class="risk-card-top"><span class="risk-icon">${meta.icon}</span><div><div class="risk-name">${meta.name}</div><div class="risk-desc">${meta.desc}</div></div><span class="risk-state muted">暂不可用</span></div><div class="risk-empty">${escapeHTML(data.error || '风险服务暂时不可用')}</div></article>`;
      }
      const pct = Math.max(0, Math.min(100, Number(data.risk_percent) || 0));
      const level = data.risk_level === 'higher' ? '需重点关注' : data.risk_level === 'moderate' ? '建议留意' : '相对较低';
      const stateClass = data.risk_level === 'higher' ? 'high' : data.risk_level === 'moderate' ? 'mid' : 'low';
      const confidence = data.confidence === 'low' ? '可信度较低' : data.confidence === 'medium' ? '可信度中等' : '可信度较高';
      const missing = Array.isArray(data.missing_features) ? data.missing_features.length : 0;
      const completeness = data.data_completeness || {};
      const nextSteps = Array.isArray(completeness.next_steps) ? completeness.next_steps.slice(0, 2) : [];
      const completenessText = missing
        ? `建议先补充：${nextSteps.map(escapeHTML).join('、') || '个人病史和生活方式资料'}`
        : '模型输入资料较完整，可结合复测继续观察';
      return `<article class="disease-risk-card ${meta.tone}">
        <div class="risk-card-top"><span class="risk-icon">${meta.icon}</span><div><div class="risk-name">${meta.name}</div><div class="risk-desc">${meta.desc}</div></div><span class="risk-state ${stateClass}">${level}</span></div>
        <div class="risk-number-row"><span class="risk-number">${pct.toFixed(2)}</span><span class="risk-unit">%</span><span class="risk-confidence">${confidence}</span></div>
        <div class="risk-bar"><span style="width:${Math.max(3, pct)}%"></span></div>
        <div class="risk-meta"><span>模型：${data.model === 'xgboost' ? 'XGBoost' : 'Logistic'}</span><span>${missing ? '缺少 ' + missing + ' 项数据' : '数据较完整'}</span></div>
        <div class="risk-desc" style="margin-top:8px;color:#9C8B7A">${completenessText}</div>
      </article>`;
    }

    function renderTotal(d) {
      const total = d.total_score;
      document.getElementById('ring-num').textContent = total;
      const dash = Math.round((total / 100) * 628);
      document.getElementById('ring-progress').setAttribute('stroke-dasharray', `${dash} 628`);
      const badge = total >= 80 ? '状态良好' : total >= 60 ? '需关注' : '需复诊';
      const badgeBg = total >= 80 ? '#E5F0DC' : total >= 60 ? '#FFE9D9' : '#FBE4DD';
      const badgeColor = total >= 80 ? '#5A8045' : total >= 60 ? '#F4A261' : '#A04632';
      const el = document.getElementById('total-badge');
      el.textContent = badge;
      el.style.background = badgeBg;
      el.style.color = badgeColor;
      document.getElementById('summary-text').textContent = d.summary;
      document.getElementById('ring-meta').textContent = '· 实时计算自今日数据';
    }

    function renderSubs(s) {
      const order = [
        { key: 'sleep',     label: '睡眠',     bg: '#F1E8F5', color: '#9C7BC9' },
        { key: 'nutrition', label: '营养',     bg: '#FFE9D9', color: '#F4A261' },
        { key: 'mood',      label: '情绪',     bg: '#FBE4DD', color: '#E0784E' },
        { key: 'activity',  label: '活动',     bg: '#E5F0DC', color: '#7FB069' },
        { key: 'chronic',   label: '慢病控制', bg: '#F4D5C9', color: '#A04632' },
      ];
      const list = document.getElementById('sub-list');
      list.innerHTML = order.map(o => {
        const v = s[o.key] ?? 80;
        const w = Math.round((v / 100) * 400);
        return `
          <div class="sub-row">
            <div class="sub-label">${o.label}</div>
            <div class="sub-bar" style="background:${o.bg}"><div class="sub-fill" style="width:${w}px;background:${o.color}"></div></div>
            <div class="sub-num">${v}</div>
          </div>
        `;
      }).join('');
    }

    function renderAdlIadl(d) {
      // ADL / IADL：仅展示真实评估记录，无记录显示 "--"（严禁兜底假值）
      document.getElementById('adl').textContent = d.adl ?? '--';
      document.getElementById('iadl').textContent = d.iadl ?? '--';
      document.getElementById('life-sub').textContent = `ADL / IADL 综合 · ${fmtDate(new Date().toISOString())}`;
    }

    function renderSuggest(list) {
      const host = document.getElementById('suggest-list');
      if (!list || !list.length) { host.innerHTML = '<div class="empty">当前没有建议</div>'; return; }
      const colors = ['#E8896E', '#F4A261', '#7FB069'];
      const chars = ['1', '2', '3'];
      host.innerHTML = list.slice(0, 3).map((s, i) => `
        <div class="imp-row" style="background:${i === 0 ? '#FBE4DD' : i === 1 ? '#FFE9D9' : '#E5F0DC'}">
          <div class="imp-icon" style="background:${colors[i]}">${chars[i]}</div>
          <div class="imp-text">
            <div class="imp-name" style="color:${i === 0 ? '#A04632' : i === 1 ? '#8C4520' : '#3D6630'}">${escapeHTML(s.title)}</div>
            <div class="imp-desc" style="color:${i === 0 ? '#8A4538' : i === 1 ? '#A45F3D' : '#5A8045'}">${escapeHTML(s.detail)}</div>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('btn-assess').addEventListener('click', async () => {
      try {
        await API.post('/api/assessments', {});
        toast('已生成新评估', 'success');
        loadAll();
      } catch (err) { toast(err.message, 'error'); }
    });

    function escapeHTML(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]); }
  </script>
</body>
</html>
