<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>健康监测 · 小康·健康管家</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div id="app-nav"></div>

  <main class="main">
    <header class="page-head">
      <h1><span class="desktop-only">健康监测</span><span class="mobile-only">快速记录</span></h1>
      <p class="subtitle"><span class="desktop-only">记录、查看与预测你的健康指标</span><span class="mobile-only">点选指标，或直接说出今天的健康数据</span></p>
    </header>

    <section class="bulk-health-entry" aria-labelledby="bulk-entry-title">
      <div class="bulk-entry-head">
        <div>
          <span class="section-kicker">一句话记录</span>
          <h2 id="bulk-entry-title">把今天的健康数据一起告诉我</h2>
          <p>可以打字，也可以按下语音按钮慢慢说。识别后先核对卡片，确认才会保存。</p>
        </div>
        <span class="bulk-entry-badge">不会自动保存</span>
      </div>
      <label class="sr-only" for="health-description">健康数据描述</label>
      <textarea id="health-description" class="bulk-health-textarea" maxlength="2000" rows="4" placeholder="例如：早上静坐后血压128/85，空腹血糖5.8，静息心率72，血氧97，体重56.2公斤，昨晚睡了7个半小时，今天走了4820步。"></textarea>
      <div class="bulk-entry-controls">
        <button type="button" class="btn btn-secondary bulk-voice-btn" id="bulk-voice-btn" aria-pressed="false">
          <span aria-hidden="true">🎙</span><span id="bulk-voice-label">开始语音输入</span>
        </button>
        <button type="button" class="btn btn-primary" id="bulk-parse-btn">识别并填入今日数据</button>
        <button type="button" class="btn btn-ghost" id="bulk-clear-btn">清空</button>
      </div>
      <p class="bulk-entry-privacy" id="bulk-speech-help">语音是否可用取决于浏览器；语音转文字可能由浏览器的语音服务处理。</p>
      <div class="bulk-entry-status" id="bulk-entry-status" role="status" aria-live="polite"></div>

      <div class="bulk-preview" id="bulk-preview" hidden>
        <div class="bulk-preview-head">
          <div>
            <h3>已填入下方“今日数据”</h3>
            <p>带“待确认”标记的卡片是本次识别结果；点击卡片可以修改。</p>
          </div>
          <strong id="bulk-preview-count">0项</strong>
        </div>
        <div class="bulk-warning-list" id="bulk-warning-list"></div>
        <div class="bulk-draft-summary" id="bulk-draft-summary"></div>
        <div class="bulk-preview-actions">
          <button type="button" class="btn btn-primary" id="bulk-save-btn">确认并保存到今日数据</button>
          <button type="button" class="btn btn-ghost" id="bulk-cancel-btn">取消本次填充</button>
        </div>
      </div>
    </section>

    <section class="entry-section">
      <div class="entry-header">
        <span class="entry-title">今日数据</span>
        <span class="entry-tip" id="entry-tip">--</span>
      </div>

      <div class="entry-grid" id="metric-grid"></div>
    </section>

    <section class="monitor-bottom">
      <div class="device-card">
        <div class="device-header">
          <span class="device-title">我的设备</span>
          <button class="btn btn-ghost" id="btn-add-device" style="padding:6px 0">+ 添加</button>
        </div>
        <div class="device-list" id="device-list"></div>
      </div>

      <div class="pred-card pred-card-clickable" onclick="location.href='prediction.html'">
        <div class="pred-header">
          <span class="pred-title">AI 健康预测 <span style="font-size:12px;color:#9C8B7A;font-weight:400">› 点击查看详情</span></span>
          <span class="pred-badge" id="pred-badge">—</span>
        </div>
        <div class="pred-alert">
          <div class="pred-alert-title">未来 7 天</div>
          <div class="pred-alert-main">综合趋势</div>
          <div class="pred-alert-desc" id="pred-desc">—</div>
        </div>
        <div class="pred-chart">
          <div class="pred-chart-label">近 7 天血压趋势（收缩压）</div>
          <svg id="pred-svg" width="100%" height="80" viewBox="0 0 540 80"></svg>
        </div>
        <div class="pred-suggest">
          <div class="pred-suggest-icon">✓</div>
          <div class="pred-suggest-text" id="pred-suggest">—</div>
        </div>
      </div>
    </section>
  </main>

  <!-- 录入浮窗 -->
  <div class="modal-mask" id="record-modal">
    <div class="modal">
      <h3 id="record-title">录入数据</h3>
      <form class="form" id="record-form">
        <div class="form-row">
          <label id="lbl-value">数值</label>
          <input class="input" id="rec-value" required />
          <span class="hint-text" id="rec-hint">—</span>
        </div>
        <div class="form-row" id="rec-row2" hidden>
          <label>舒张压</label>
          <input class="input" id="rec-value2" />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-close>取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 自定义采集项浮窗 -->
  <div class="modal-mask" id="custom-modal">
    <div class="modal">
      <h3>添加自定义采集项</h3>
      <form class="form custom-metric-form" id="custom-form">
        <div class="form-row">
          <label>指标名称</label>
          <input class="input" id="cm-name" placeholder="如：排尿次数" required />
        </div>
        <div class="form-row">
          <label>单位</label>
          <input class="input" id="cm-unit" placeholder="如：次/日" />
        </div>
        <div class="form-row">
          <label>参考范围（可选）</label>
          <div style="display:flex;gap:8px;align-items:center">
            <input class="input" id="cm-min" type="number" placeholder="下限" style="flex:1" />
            <span style="color:#9C8B7A">~</span>
            <input class="input" id="cm-max" type="number" placeholder="上限" style="flex:1" />
          </div>
        </div>
        <div class="form-row">
          <label>选择图标</label>
          <div class="custom-metric-icon-row" id="cm-icon-row">
            <button type="button" class="custom-metric-icon-btn selected" data-icon="自">自</button>
            <button type="button" class="custom-metric-icon-btn" data-icon="测">测</button>
            <button type="button" class="custom-metric-icon-btn" data-icon="记">记</button>
            <button type="button" class="custom-metric-icon-btn" data-icon="项">项</button>
            <button type="button" class="custom-metric-icon-btn" data-icon="数">数</button>
            <button type="button" class="custom-metric-icon-btn" data-icon="量">量</button>
          </div>
        </div>
        <div class="form-row">
          <label>选择颜色</label>
          <div class="custom-metric-color-row" id="cm-color-row">
            <button type="button" class="custom-metric-color-btn selected" data-color="#F4A261" style="background:#F4A261"></button>
            <button type="button" class="custom-metric-color-btn" data-color="#E0784E" style="background:#E0784E"></button>
            <button type="button" class="custom-metric-color-btn" data-color="#7FB069" style="background:#7FB069"></button>
            <button type="button" class="custom-metric-color-btn" data-color="#9C7BC9" style="background:#9C7BC9"></button>
            <button type="button" class="custom-metric-color-btn" data-color="#3E8E8E" style="background:#3E8E8E"></button>
            <button type="button" class="custom-metric-color-btn" data-color="#A04632" style="background:#A04632"></button>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-close>取消</button>
          <button type="submit" class="btn btn-primary">添加</button>
        </div>
      </form>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/health-bulk-entry.js"></script>
  <script>
    document.addEventListener('auth:ready', () => {
      loadAll();
    });
    Auth.init();

    // 内置指标定义：从 /api/health/metric-defs 拉取（后端 metric_defs 表为单一数据源）
    let METRIC_DEFS = [];
    let latestMetrics = {};

    // 格式化逻辑（渲染层，非指标定义；defs 未覆盖的 type 走通用格式）
    const FMT = {
      bp:      v => v ? `${v.value}/${v.value2}` : '--',
      glucose: v => v ? v.value.toFixed(1) : '--',
      hr:      v => v ? Math.round(v.value) : '--',
      sleep:   v => v ? v.value.toFixed(1) + 'h' : '--',
      spo2:    v => v ? Math.round(v.value) : '--',
      weight:  v => v ? v.value.toFixed(1) : '--',
      steps:   v => v ? Math.round(v.value).toLocaleString() : '--',
      temp:    v => v ? v.value.toFixed(1) : '--',
      resp:    v => v ? Math.round(v.value) : '--',
      grip:    v => v ? v.value.toFixed(1) : '--',
      bodyfat: v => v ? v.value.toFixed(1) : '--',
      waist:   v => v ? v.value.toFixed(0) : '--',
      uricacid: v => v ? Math.round(v.value) : '--',
      cholesterol: v => v ? v.value.toFixed(1) : '--',
      hba1c:   v => v ? v.value.toFixed(1) : '--',
    };
    const defaultFmt = v => v ? (v.value2 != null ? `${v.value}/${v.value2}` : String(v.value)) : '--';

    async function loadMetricDefs() {
      try {
        const defs = await API.get('/api/health/metric-defs');
        METRIC_DEFS = defs.map(d => ({
          type: d.type,
          name: d.name,
          unit: d.unit,
          color: d.color,
          bg: d.color + '22',
          icon: d.icon,
          fmt: FMT[d.type] || defaultFmt,
        }));
      } catch {
        // 定义加载失败时页面保持空卡片可交互，不白屏
        METRIC_DEFS = [];
      }
    }

    // 自定义指标（从后端加载后追加）
    let customDefs = [];

    async function loadCustomMetrics() {
      try {
        const all = await API.get('/api/prediction/metrics');
        customDefs = all.filter(m => m.custom).map(m => ({
          type: m.key,
          name: m.name,
          unit: m.unit,
          color: m.color,
          bg: m.color + '22',
          icon: m.icon,
          fmt: v => v ? v.value : '--',
          custom: true,
        }));
      } catch {}
    }

    async function loadAll() {
      await Promise.all([loadMetricDefs(), loadCustomMetrics()]);
      const [metrics, devices] = await Promise.all([
        API.get('/api/health/metrics'),
        API.get('/api/devices'),
      ]);
      latestMetrics = metrics;
      renderMetrics(metrics);
      renderDevices(devices);
      renderPred(metrics);
    }

    function renderMetrics(metrics) {
      const allDefs = [...METRIC_DEFS, ...customDefs];
      const recorded = allDefs.filter(d => metrics[d.type]).length;
      const draftCount = allDefs.filter(d => window.HealthBulkEntry?.getDraft?.(d.type)).length;
      document.getElementById('entry-tip').textContent = `已记录 ${recorded}/${allDefs.length}${draftCount ? ` · 待确认 ${draftCount}项` : ''}`;
      const grid = document.getElementById('metric-grid');
      const cards = allDefs.map(d => {
        const m = metrics[d.type];
        const draft = window.HealthBulkEntry?.getDraft?.(d.type);
        const shown = draft ? { value: draft.value, value2: draft.value2 } : m;
        const mainText = d.fmt(shown);
        const unitText = draft ? '识别填充 · 点击可修改' : (m ? `${d.unit} · ${fmtTime(m.recorded_at)}` : '点击录入');
        return `
          <button class="entry-card ${draft ? 'entry-card-draft' : ''}" data-type="${d.type}" style="text-align:left;cursor:pointer">
            ${draft ? '<span class="entry-draft-badge">待确认</span>' : ''}
            <div class="entry-icon" style="background:${d.bg};color:${d.color}">${d.icon}</div>
            <div class="entry-lbl">${d.name}</div>
            <div class="entry-val">${mainText}</div>
            <div class="entry-unit" style="color:${draft ? '#874018' : (m ? '#5A8045' : '#9C8B7A')}">${unitText}</div>
          </button>
        `;
      }).join('');
      grid.innerHTML = cards + `
        <button class="entry-card entry-card-add" id="btn-add-metric" style="text-align:center;cursor:pointer">
          <div class="entry-icon">+</div>
          <div class="entry-lbl">添加采集项</div>
          <div class="entry-unit">自定义指标</div>
        </button>
      `;
      grid.querySelectorAll('button.entry-card[data-type]').forEach(btn => {
        btn.addEventListener('click', () => openRecord(btn.dataset.type));
      });
      document.getElementById('btn-add-metric')?.addEventListener('click', openCustomMetricModal);
    }

    window.refreshTodayCards = () => renderMetrics(latestMetrics);

    function renderDevices(devices) {
      const list = document.getElementById('device-list');
      if (!devices.length) {
        list.innerHTML = '<div class="empty">还没有设备</div>';
        return;
      }
      list.innerHTML = devices.map(d => `
        <div class="device-row">
          <div class="device-icon">${(d.name || '·').slice(0, 1)}</div>
          <div class="device-text">
            <div class="device-name">${escapeHTML(d.name)}</div>
            <div class="device-status" style="color:${d.status === 'connected' ? '#5A8045' : '#9C8B7A'}">
              ${d.status === 'connected' ? '已连接' : '未连接'}${d.last_sync ? ' · ' + fromNow(d.last_sync) : ''}
            </div>
          </div>
        </div>
      `).join('');
    }

    async function renderPred(metrics) {
      try {
        const bpHistory = await API.get('/api/health/metrics/bp/history?days=7');
        const points = bpHistory.points;
        document.getElementById('pred-desc').textContent =
          `基于血压、血氧、睡眠和活动等 ${METRIC_DEFS.length + customDefs.length} 项数据综合评估；近 7 天共 ${points.length} 条血压记录。点击查看完整预测 →`;
        document.getElementById('pred-suggest').textContent = '建议：维持规律作息，每日散步 30 分钟';
        const sbpValues = points.map(p => p.value);
        const avg = sbpValues.length ? Math.round(sbpValues.reduce((a,b)=>a+b,0) / sbpValues.length) : 0;
        let badge = '正常', badgeColor = '#7FB069';
        if (avg >= 140) { badge = '需关注'; badgeColor = '#E0784E'; }
        else if (avg >= 130) { badge = '偏高'; badgeColor = '#F4A261'; }
        document.getElementById('pred-badge').textContent = `● ${badge}`;
        document.getElementById('pred-badge').setAttribute('aria-label', `综合趋势状态：${badge}`);
        document.getElementById('pred-badge').style.background = badgeColor + '22';
        document.getElementById('pred-badge').style.color = badgeColor;

        // 绘制折线图
        const svg = document.getElementById('pred-svg');
        if (points.length === 0) {
          svg.dataset.summary = '近7天血压趋势：暂无血压记录，无法判断上升、下降或稳定。';
          svg.innerHTML = '<text x="50%" y="50%" text-anchor="middle" fill="#9C8B7A" font-size="13" font-family="sans-serif">暂无血压记录</text>';
          return;
        }
        const W = 540, H = 80, padX = 12, padY = 14;
        const xs = points.map((_, i) => i);
        const ys = points.map(p => p.value);
        const yMin = Math.min(...ys) - 5;
        const yMax = Math.max(...ys) + 5;
        const xToPx = (i) => padX + (xs.length === 1 ? (W - 2*padX)/2 : (i/(xs.length-1))*(W - 2*padX));
        const yToPx = (v) => H - padY - ((v - yMin) / (yMax - yMin)) * (H - 2*padY);
        const polyline = points.map((p, i) => `${xToPx(i)},${yToPx(p.value)}`).join(' ');
        const first = points[0];
        const latest = points.at(-1);
        const change = Number(latest.value) - Number(first.value);
        const direction = change > 0 ? '上升' : change < 0 ? '下降' : '持平';
        svg.dataset.summary = `近7天收缩压趋势：共${points.length}条记录，从${first.value}变为${latest.value}毫米汞柱，总体${direction}${Math.abs(change).toFixed(1)}；平均${avg}毫米汞柱，页面状态标记为${badge}。此摘要只描述已有记录，不替代医学判断。`;
        const dots = points.map((p, i) =>
          `<circle cx="${xToPx(i)}" cy="${yToPx(p.value)}" r="3.5" fill="#F4A261"/>`
        ).join('');
        svg.innerHTML = `
          <polyline points="${polyline}" fill="none" stroke="#F4A261" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          ${dots}
        `;
      } catch (err) {
        document.getElementById('pred-desc').textContent = '预测生成失败';
      }
    }

    // ===== 录入浮窗 =====
    function openRecord(type) {
      const def = getMetricDef(type) || METRIC_DEFS.find(d => d.type === type);
      if (!def) return;
      document.getElementById('record-title').textContent = `录入${def.name}`;
      document.getElementById('lbl-value').textContent = type === 'bp' ? '收缩压（高压）' : '数值';
      document.getElementById('rec-hint').textContent = def.unit ? `单位：${def.unit}` : '请输入数值';
      document.getElementById('rec-row2').hidden = type !== 'bp';
      const draft = window.HealthBulkEntry?.getDraft?.(type);
      document.getElementById('rec-value').value = draft?.value ?? '';
      document.getElementById('rec-value2').value = draft?.value2 ?? '';
      const modal = document.getElementById('record-modal');
      modal.classList.add('show');
      modal.dataset.type = type;
      setTimeout(() => document.getElementById('rec-value').focus(), 50);
    }
    function closeRecord() {
      document.getElementById('record-modal').classList.remove('show');
    }
    document.getElementById('record-modal').addEventListener('click', (e) => {
      if (e.target.id === 'record-modal' || e.target.dataset.close !== undefined) closeRecord();
    });
    document.getElementById('record-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const type = document.getElementById('record-modal').dataset.type;
      const def = getMetricDef(type) || METRIC_DEFS.find(d => d.type === type);
      if (!def) return;
      const v1 = document.getElementById('rec-value').value.trim();
      const v2 = type === 'bp' ? document.getElementById('rec-value2').value.trim() : null;
      if (!v1) return;
      const value = parseFloat(v1);
      const value2 = v2 ? parseFloat(v2) : null;
      const draft = window.HealthBulkEntry?.getDraft?.(type);
      try {
        await API.post('/api/health/metrics', {
          type, value, value2, unit: def.unit || null, source: 'manual',
          note: draft ? '由健康数据描述核对后录入' : null,
          measurement_condition: draft?.measurement_condition,
          measurement_context: draft ? { entry_mode: 'text_review', parser_version: 'health_text_v1', user_confirmed: true } : undefined,
        });
        window.HealthBulkEntry?.removeDraft?.(type);
        toast('录入成功', 'success');
        closeRecord();
        loadAll();
      } catch (err) {
        toast(err.message, 'error');
      }
    });

    function escapeHTML(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]); }

    // ===== 自定义采集项 =====
    let selectedIcon = '自';
    let selectedColor = '#F4A261';

    function openCustomMetricModal() {
      const modal = document.getElementById('custom-modal');
      modal.classList.add('show');
      document.getElementById('cm-name').value = '';
      document.getElementById('cm-unit').value = '';
      document.getElementById('cm-min').value = '';
      document.getElementById('cm-max').value = '';
      selectedIcon = '自';
      selectedColor = '#F4A261';
      setTimeout(() => document.getElementById('cm-name').focus(), 50);
    }

    document.getElementById('custom-modal').addEventListener('click', (e) => {
      if (e.target.id === 'custom-modal' || e.target.dataset.close !== undefined) {
        document.getElementById('custom-modal').classList.remove('show');
      }
    });

    document.getElementById('cm-icon-row').addEventListener('click', (e) => {
      const btn = e.target.closest('.custom-metric-icon-btn');
      if (!btn) return;
      document.querySelectorAll('#cm-icon-row .custom-metric-icon-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedIcon = btn.dataset.icon;
    });

    document.getElementById('cm-color-row').addEventListener('click', (e) => {
      const btn = e.target.closest('.custom-metric-color-btn');
      if (!btn) return;
      document.querySelectorAll('#cm-color-row .custom-metric-color-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedColor = btn.dataset.color;
    });

    document.getElementById('custom-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('cm-name').value.trim();
      const unit = document.getElementById('cm-unit').value.trim();
      const ref_min = document.getElementById('cm-min').value ? parseFloat(document.getElementById('cm-min').value) : null;
      const ref_max = document.getElementById('cm-max').value ? parseFloat(document.getElementById('cm-max').value) : null;
      if (!name) return;
      try {
        await API.post('/api/prediction/custom-metrics', {
          name, unit, icon: selectedIcon, color: selectedColor, ref_min, ref_max,
        });
        toast('添加成功', 'success');
        document.getElementById('custom-modal').classList.remove('show');
        loadAll();
      } catch (err) {
        toast(err.message, 'error');
      }
    });

    // 录入自定义指标时更新提示
    function getMetricDef(type) {
      return [...METRIC_DEFS, ...customDefs].find(d => d.type === type);
    }
  </script>
</body>
</html>
