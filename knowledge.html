<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>健康知识 · 小康·健康管家</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div id="app-nav"></div>

  <main id="page" class="metric-page" data-mode="list">
    <!-- 列表模式 -->
    <section id="view-list">
      <header class="page-head">
        <h1>健康知识</h1>
        <p class="subtitle">实用的健康科普、问答和每日贴士</p>
      </header>

      <section class="knowledge-search-panel" aria-labelledby="knowledge-search-title">
        <div>
          <h2 id="knowledge-search-title">查找健康知识</h2>
          <p>先查本地中文知识；需要更多资料时，再联网查找公开研究文献。</p>
        </div>
        <div class="knowledge-search-row">
          <label class="sr-only" for="search">健康知识关键词</label>
          <input class="search-input" id="search" type="search" maxlength="120" placeholder="例如：血压、睡眠、跌倒、记忆…" />
          <button class="btn btn-secondary" id="search-local" type="button">搜索本地知识</button>
          <button class="btn btn-primary" id="search-online" type="button">联网查研究</button>
        </div>
        <p class="knowledge-privacy-note">联网时只发送您输入的主题，不发送姓名、健康档案或测量数据。</p>
      </section>
      </div>

      <div class="filter-bar" id="filter-bar">
        <a class="chip active" data-cat="">全部</a>
        <a class="chip" data-cat="topic">科普</a>
        <a class="chip" data-cat="qa">问答</a>
        <a class="chip" data-cat="tip">贴士</a>
      </div>

      <div class="tags" id="popular-tags" style="margin-top:0"></div>

      <div id="article-list" class="article-grid"></div>

      <section id="online-research" class="online-research" hidden aria-live="polite">
        <div class="online-research-head">
          <div>
            <span class="research-preview-badge">外部资料 · 尚未审核</span>
            <h2>联网研究资料</h2>
            <p id="online-search-summary">结果来自 Europe PMC 生物医学文献库。</p>
          </div>
          <button id="close-online-results" class="btn btn-ghost" type="button">收起联网结果</button>
        </div>
        <div class="online-research-notice" id="online-research-notice">
          联网结果用于查找原始资料，不会自动进入您的健康结论，也不替代医生建议。
        </div>
        <div id="online-result-list" class="online-result-list"></div>
      </section>

      <section id="relationship-lab" hidden style="margin-top:32px;background:#fff;border:1px solid #eadfd3;border-radius:20px;padding:24px;">
        <div style="display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;">
          <div>
            <h2 style="margin:0 0 8px;font-size:24px;">图谱关联发现</h2>
            <p style="margin:0;color:var(--c-text-muted);font-size:16px;">测试版已启用。帮助发现跨主题的间接关联，但不代表直接因果。</p>
          </div>
          <button id="refresh-relations" class="btn btn-ghost" type="button">按当前关键词发现关系</button>
        </div>
        <div id="relationship-list" style="margin-top:18px;"></div>
      </section>
    </section>

    <!-- 详情模式 -->
    <section id="view-detail" hidden>
      <a href="knowledge.html" class="btn btn-ghost" style="margin-bottom:16px;">← 返回列表</a>
      <article class="article-body" id="article-body"></article>
    </section>

    <div class="loading-page" id="loading" hidden><span class="loading"></span> 正在读取…</div>
  </main>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    Auth.init().then(() => main());

    let activeCat = '';

    async function main() {
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      if (id) {
        await loadDetail(parseInt(id, 10));
      } else {
        bindFilter();
        bindSearch();
        bindOnlineSearch();
        const initialQ = params.get('q') || '';
        document.getElementById('search').value = initialQ;
        await loadPopularTags();
        await loadList();
        document.getElementById('relationship-lab').hidden = false;
        document.getElementById('refresh-relations').addEventListener('click', loadRelationshipCandidates);
        await loadRelationshipCandidates();
      }
    }

    function bindFilter() {
      const bar = document.getElementById('filter-bar');
      bar.addEventListener('click', (e) => {
        const chip = e.target.closest('.chip');
        if (!chip) return;
        e.preventDefault();
        bar.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === chip));
        activeCat = chip.dataset.cat;
        loadList();
      });
    }
    let searchTimer;
    function bindSearch() {
      const input = document.getElementById('search');
      input.addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(loadList, 250);
      });
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') { event.preventDefault(); loadList(); }
      });
      document.getElementById('search-local').addEventListener('click', loadList);
    }

    function bindOnlineSearch() {
      document.getElementById('search-online').addEventListener('click', loadOnlineResearch);
      document.getElementById('close-online-results').addEventListener('click', () => {
        document.getElementById('online-research').hidden = true;
        document.getElementById('search-online').focus();
      });
    }

    async function loadOnlineResearch() {
      const q = document.getElementById('search').value.trim();
      const section = document.getElementById('online-research');
      const list = document.getElementById('online-result-list');
      const button = document.getElementById('search-online');
      section.hidden = false;
      section.scrollIntoView({ behavior: 'smooth', block: 'start' });
      if (!q) {
        list.innerHTML = '<div class="empty">请先输入一个健康主题，例如“老年人睡眠”或“血压复测”。</div>';
        document.getElementById('search').focus();
        return;
      }
      button.disabled = true;
      button.textContent = '正在联网查询…';
      list.innerHTML = '<div class="loading-page"><span class="loading"></span> 正在查询公开研究文献…</div>';
      try {
        const data = await API.get('/api/knowledge/online-search?q=' + encodeURIComponent(q));
        document.getElementById('online-search-summary').textContent =
          `“${q}”找到 ${data.total_available || 0} 条相关记录，本页显示前 ${data.items?.length || 0} 条。${data.cached ? '（使用十分钟内缓存）' : ''}`;
        document.getElementById('online-research-notice').textContent = data.disclaimer || '外部资料尚未经过本项目医学审核。';
        if (!data.items?.length) {
          list.innerHTML = '<div class="empty">暂未找到相关研究。可以换用更简短的主题再试。</div>';
          return;
        }
        list.innerHTML = data.items.map((item, index) => `
          <article class="online-result-card">
            <div class="online-result-number">研究资料 ${index + 1}</div>
            <h3>${escapeHTML(item.title_original)}</h3>
            <div class="online-original-label">原始研究题目（可能为英文）</div>
            <p class="online-result-meta">${escapeHTML(item.authors)} · ${escapeHTML(item.journal)} · ${escapeHTML(item.publication_year)}</p>
            ${item.abstract ? `<details><summary>查看原始摘要</summary><p>${escapeHTML(item.abstract)}</p></details>` : '<p class="online-no-abstract">该记录暂无可展示摘要。</p>'}
            <div class="online-result-footer">
              <span>${item.pmid ? `文献编号：${escapeHTML(item.pmid)}` : '文献编号暂缺'}</span>
              <a class="btn btn-ghost" href="${safeURL(item.source_url)}" target="_blank" rel="noopener noreferrer">到来源页查看</a>
            </div>
          </article>
        `).join('');
      } catch (err) {
        list.innerHTML = `<div class="empty">${escapeHTML(err.message || '联网研究检索暂时不可用，请稍后重试。')}</div>`;
      } finally {
        button.disabled = false;
        button.textContent = '联网查研究';
      }
    }

    async function loadList() {
      const q = document.getElementById('search').value.trim();
      const list = document.getElementById('article-list');
      list.innerHTML = '<div class="loading-page"><span class="loading"></span> 读取中…</div>';
      try {
        const qs = new URLSearchParams();
        if (activeCat) qs.set('category', activeCat);
        if (q) qs.set('q', q);
        const { items } = await API.get('/api/knowledge?' + qs);
        if (!items.length) {
          list.innerHTML = '<div class="empty"><div class="emoji">📭</div>没找到相关文章</div>';
          return;
        }
        list.innerHTML = items.map(a => `
          <a class="article-card ${a.category}" href="knowledge.html?id=${a.id}">
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
              <span class="category-tag">${categoryName(a.category)}</span>
              <span style="font-size:13px;font-weight:700;color:${a.review_status === 'approved' ? '#356b3f' : '#8a5a22'};">${reviewName(a.review_status)}</span>
            </div>
            <div class="title">${escapeHTML(a.title)}</div>
            <div class="summary">${escapeHTML(a.summary || '')}</div>
            <div class="meta">
              ${a.view_count} 次浏览 · ${fmtDate(a.created_at)}
            </div>
          </a>
        `).join('');
      } catch (err) {
        list.innerHTML = `<div class="empty">读取失败：${escapeHTML(err.message)}</div>`;
      }
    }

    async function loadRelationshipCandidates() {
      const host = document.getElementById('relationship-list');
      const q = document.getElementById('search').value.trim();
      host.innerHTML = '<div class="loading-page"><span class="loading"></span> 正在寻找跨主题关联…</div>';
      try {
        const qs = new URLSearchParams();
        if (q) qs.set('q', q);
        const data = await API.get('/api/knowledge/graph/relationship-candidates?' + qs);
        if (!data.items?.length) {
          host.innerHTML = '<div class="empty">当前关键词下没有新的两跳关系候选。可换一个主题再试。</div>';
          return;
        }
        host.innerHTML = data.items.slice(0, 6).map(item => {
          const labels = item.node_labels || [];
          return `<article style="padding:16px 0;border-top:1px solid #eee3d8;">
            <div style="font-size:18px;font-weight:700;line-height:1.6;">${labels.map(escapeHTML).join(' → ')}</div>
            <div style="margin-top:6px;font-size:14px;color:#8a5a22;font-weight:700;">测试版研究预览 · 间接关联</div>
            <p style="margin:8px 0 0;color:var(--c-text-muted);font-size:15px;line-height:1.7;">${escapeHTML(item.allowed_expression || '这是关联线索，尚未证明直接因果。')}</p>
          </article>`;
        }).join('') + `<p style="font-size:14px;color:var(--c-text-muted);margin:14px 0 0;">${escapeHTML(data.disclaimer || '')}</p>`;
      } catch (err) {
        host.innerHTML = `<div class="empty">关系发现失败：${escapeHTML(err.message)}</div>`;
      }
    }

    async function loadPopularTags() {
      try {
        const tags = await API.get('/api/knowledge/meta/popular-tags');
        const host = document.getElementById('popular-tags');
        host.innerHTML = tags.slice(0, 8).map(t =>
          `<a class="tag" href="knowledge.html?q=${encodeURIComponent(t.tag)}">${escapeHTML(t.tag)} · ${t.count}</a>`
        ).join('');
      } catch {}
    }

    async function loadDetail(id) {
      document.getElementById('view-list').hidden = true;
      document.getElementById('view-detail').hidden = false;
      document.getElementById('page').dataset.mode = 'detail';
      const body = document.getElementById('article-body');
      body.innerHTML = '<div class="loading-page"><span class="loading"></span> 读取中…</div>';
      try {
        const a = await API.get('/api/knowledge/' + id);
        const tags = (a.tags || []).map(t =>
          `<a class="tag" href="knowledge.html?q=${encodeURIComponent(t)}">${escapeHTML(t)}</a>`
        ).join('');
        body.innerHTML = `
          <header>
            <span class="category-tag" style="display:inline-flex;background:#FFE9D9;color:#8C4520;font-size:13px;font-weight:700;padding:6px 14px;border-radius:14px;font-family:var(--font-cn)">${categoryName(a.category)}</span>
            <h1 style="font-size:30px;color:var(--c-text);font-family:var(--font-cn);margin:12px 0 6px;font-weight:700">${escapeHTML(a.title)}</h1>
            <div style="color:var(--c-text-muted);font-size:14px;font-family:var(--font-cn);margin-bottom:16px">${a.view_count} 次浏览</div>
          </header>
          <div style="padding:14px 16px;border-radius:14px;background:${a.review_status === 'approved' ? '#edf6ea' : '#fff5e8'};margin-bottom:18px;font-size:16px;line-height:1.7;">
            <strong>${reviewName(a.review_status)}</strong>：${a.review_status === 'approved' ? '内容已通过项目医学审核。' : '内容尚待项目医学审核，仅用于健康教育研究预览，不替代诊断或用药建议。'}
            ${a.source_url ? `<br>来源：<a href="${safeURL(a.source_url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(a.source_label || '查看权威来源')}</a>` : ''}
          </div>
          ${tags ? `<div class="tags">${tags}</div>` : ''}
          ${markdownToHTML(a.body)}
        `;
      } catch (err) {
        body.innerHTML = `<div class="empty">文章加载失败：${escapeHTML(err.message)}</div>`;
      }
    }

    function categoryName(c) {
      return { topic: '科普', qa: '问答', tip: '贴士' }[c] || c;
    }
    function reviewName(status) { return status === 'approved' ? '已审核' : status === 'rejected' ? '已退回' : '研究预览'; }
    function safeURL(value) {
      try { const url = new URL(value); return ['http:', 'https:'].includes(url.protocol) ? escapeHTML(url.href) : '#'; }
      catch { return '#'; }
    }

    // 简易 markdown → HTML（处理 ##、**、-、表格）
    function markdownToHTML(md) {
      const lines = md.split(/\r?\n/);
      let out = '';
      let inTable = false;
      let tableLines = [];
      function flushTable() {
        if (!tableLines.length) return;
        const rows = tableLines.filter(l => l.includes('|')).map(l => l.split('|').map(s => s.trim()).filter(Boolean));
        if (rows.length < 2) {
          out += rows.map(r => r.join(' | ')).join('<br/>') + '\n';
        } else {
          const headers = rows[0];
          out += '<table><thead><tr>' + headers.map(h => `<th>${inline(h)}</th>`).join('') + '</tr></thead><tbody>';
          for (let i = 2; i < rows.length; i++) {
            out += '<tr>' + rows[i].map(h => `<td>${inline(h)}</td>`).join('') + '</tr>';
          }
          out += '</tbody></table>\n';
        }
        tableLines = [];
      }
      for (const line of lines) {
        if (line.trim().startsWith('|')) {
          inTable = true;
          tableLines.push(line);
          continue;
        } else if (inTable) {
          flushTable();
          inTable = false;
        }
        if (line.startsWith('## ')) out += `<h2>${inline(line.slice(3))}</h2>`;
        else if (line.startsWith('# ')) out += `<h2>${inline(line.slice(2))}</h2>`;
        else if (line.trim().startsWith('- ')) {
          // 多行列表不适合简易处理，用 <p> 渲染
          out += `<p>· ${inline(line.replace(/^-\s*/, ''))}</p>`;
        } else if (line.trim() === '') out += '';
        else out += `<p>${inline(line)}</p>`;
      }
      if (inTable) flushTable();
      return out;
    }
    function inline(s) {
      return escapeHTML(s)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>');
    }
    function escapeHTML(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
    }
  </script>
</body>
</html>
